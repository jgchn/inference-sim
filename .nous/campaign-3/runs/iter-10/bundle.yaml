metadata:
  iteration: 10
  family: "crossover-yield-mechanism"
  research_question: "Does Crossover Yield Advantage (crossover_yield / pareto_density) predict the sign and relative magnitude of the NSGA-II convergence gap across model architectures and load regimes?"

arms:
  - type: h-robustness
    prediction: "Both Qwen and Llama exhaustive sweeps at rate=50 complete successfully with 1800 valid configs each. Pareto density for Qwen at rate=50 will be approximately 4.5% (matching iter-7 RP-1) and for Llama approximately 5.3%. Qwen will show higher KV-axis NDR than Llama at rate=50 (unlike rate=100 where they are equal), reflecting Qwen's greater KV stress at lower load."
    mechanism: "At rate=50, Qwen (14B params, 40 layers) requires more KV capacity per request than Llama (8B params, 32 layers), creating stronger kv-axis dominance relationships even at moderate load. This model-specific stress differential produces measurably different NDR at rate=50, unlike rate=100 where both models are universally stressed."
    diagnostic: "If Qwen kv_blocks NDR is NOT higher than Llama at rate=50: the stress differential may only manifest at specific TP/instance combinations. Check per-tier NDR (e.g., tp=2,inst=2 subspace only). If densities deviate significantly from 4.5%/5.3%: the iter-7 methodology may have differed (check if iter-7 used the same 6-parameter space including block_size)."

  - type: h-main
    prediction: "Crossover Yield Advantage predicts gap sign across all 4 conditions: Qwen rate=50 (yield_advantage > 5, gap positive), Llama rate=50 (yield_advantage < 3, gap non-positive), Qwen rate=100 (yield_advantage ~9.6, gap +62.3), Llama rate=100 (yield_advantage ~10.9, gap +40.3). Zero sign mismatches between yield_advantage threshold of 4 and gap positivity."
    mechanism: "NSGA-II's crossover operator produces offspring by recombining parameters of two Pareto-optimal parents. When the Pareto front is spatially clustered (high concentration on specific parameter values), offspring inherit 'good' values from both parents with high probability — crossover yield is high. The yield advantage over random density determines whether NSGA-II's directed search outperforms uniform random coverage. At rate=50 for Llama, the lighter model has sufficient capacity across most configurations. The Pareto front becomes uniformly scattered (high entropy across axes), crossover yield drops toward the density level, and NSGA-II's population-based approach sacrifices diversity without gaining targeting advantage."
    diagnostic: "If Llama rate=50 shows yield_advantage > 5 (contradicting prediction): the Pareto front may still be concentrated on kv/batch axes even at low stress. Check per-axis entropy — if block_size still dominates (>90% on one value), that single axis provides enough concentration for high yield regardless of other axes. If Qwen rate=50 shows yield_advantage < 3: Qwen's Pareto front may also be scattered at rate=50 (iter-7's +4.6 gap was small, possibly not significantly different from 0). In that case, the crossover yield mechanism would predict BOTH models have near-zero gap at rate=50, and the +4.6 from iter-7 was noise."

  - type: h-ablation
    prediction: "NSGA-II vs random comparison at rate=50 using iter-9 methodology produces: Qwen gap > 0 (NSGA-II wins), Llama gap <= 0 (random wins or tie). Qwen gap will be modest (5-30 evals) given the expected moderate yield advantage. Llama gap will be negative (-10 to -30 evals), consistent with iter-7's -22.9."
    mechanism: "The algorithm comparison at rate=50 directly measures the convergence speed difference. With yield_advantage > 5 for Qwen, NSGA-II's crossover reliably produces Pareto configs and converges faster. With yield_advantage < 3 for Llama, NSGA-II's crossover is barely better than random at producing Pareto configs, but NSGA-II's population focus reduces effective diversity compared to uniform random search — causing random to explore more of the search space per evaluation and reach 95% HV sooner."
    diagnostic: "If Llama gap is positive at rate=50 (contradicting both prediction and iter-7): check whether the methodology difference (iter-9 uses pop=40 vs unknown iter-7 parameters) causes the discrepancy. Also verify the seed produces a representative random sample. If Qwen gap is negative or zero: the +4.6 from iter-7 may have been within noise. Check if 95% HV is reached within the first checkpoint (eval=40) for both algorithms — if so, the gap measurement is unreliable at this budget/density combination."

  - type: h-control-negative
    prediction: "Null model crossover yield (random Pareto labeling, same density) will be within 2x of Pareto density across all 4 conditions. Specifically: if actual density is 5%, null yield will be 3-10%. Observed crossover yield (actual Pareto labels) will be 5-10x higher than null yield for all conditions with positive gaps. For Llama rate=50 (predicted negative gap), observed yield will be at most 2-3x above null yield."
    mechanism: "The null model preserves the config space topology (same number of configs, same valid crossover outcomes) but destroys the spatial structure of the Pareto front by randomly assigning labels. If crossover yield is purely a function of space topology (not front clustering), null and observed yields would be similar. The large observed-vs-null gap validates that the Pareto front's spatial concentration is the mechanistic source of yield advantage."
    diagnostic: "If null yield is unexpectedly high (>3x density): the config space topology itself (constraint structure, restricted parameter ranges) may concentrate crossover outcomes regardless of Pareto labels. Investigate whether the tp*instances<=8 constraint creates 'funneling' that biases crossover toward certain regions. If null yield equals density perfectly: good — confirms the metric is well-calibrated."
