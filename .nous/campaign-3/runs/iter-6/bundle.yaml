metadata:
  iteration: 6
  family: "rate-portability"
  research_question: "Does NSGA-II's convergence advantage over random search generalize from rate=50 to rate=100 (stronger saturation), and does the advantage grow monotonically with load intensity?"

arms:
  - type: h-robustness
    prediction: "Exhaustive sweep at rate=100 produces Pareto density <= 4.5% (iter-5's rate=50 value). Exhaustive HV at rate=100 will differ from rate=50's 5.857e+10 because the throughput ceiling changes (best config at rate=100 achieves 32 rps vs ~26 rps at rate=50). The Pareto front will be more concentrated in the high-TP + block_size=32 band."
    mechanism: "Higher arrival rate (100 vs 50 req/s) shifts the KV stress threshold upward. Configs that were borderline at rate=50 (e.g., tp=2,inst=2,kv=3000,bs=16 with ttft=3399ms) become heavily stressed at rate=100 (ttft=4776ms, 108 preemptions). This causes more configs to be dominated, reducing Pareto density. The Pareto front concentrates further into configs with either (a) high-TP + block_size=32 at moderate kv_blocks, or (b) high-TP + large kv_blocks at block_size=16."
    diagnostic: "If Pareto density INCREASES at rate=100 vs rate=50, investigate whether new tradeoff dimensions emerge (e.g., configs that were dominated at rate=50 become Pareto-optimal at rate=100 due to different throughput scaling). Check tp=1 configs specifically — at rate=100 they are throughput-limited (not KV-limited), which might create a different cost-performance tradeoff from rate=50."

  - type: h-main
    prediction: "NSGA-II at rate=100 reaches 95% of exhaustive HV within 200 evaluations, and the convergence gap (eval where NSGA-II reaches 95% minus eval where random reaches 95%) at rate=100 is >= 60 evaluations. The final HV gap (NSGA-II% - random% of exhaustive) at rate=100 is >= 4.9% (iter-5's rate=50 value). This confirms NSGA-II's advantage is portable across load regimes."
    mechanism: "At rate=100, the Pareto front is more concentrated (lower density) because stronger saturation eliminates more mid-range configs from the Pareto set. NSGA-II's crossover exploits the three-way interaction (tp × kv_blocks × block_size) even more effectively because the 'safe' configuration space is narrower — crossover between two parents in the safe band is more likely to produce offspring also in the safe band. Random search, uniformly distributed across all 1800 configs, has a lower per-eval probability of hitting the sparse Pareto front."
    diagnostic: "If the convergence gap is SMALLER at rate=100 than rate=50 (< 60 evals), investigate whether the Pareto front at rate=100 is 'peaked' — i.e., a very small number of configs (< 20) account for >95% of HV. In that case, random might reach 95% quickly by luck despite low Pareto density, because each random hit contributes disproportionately to HV. Also check if tp=8 configs dominate so strongly that finding ANY tp=8 config immediately provides 90%+ of HV."

  - type: h-control-negative
    prediction: "Random search at rate=100 fails to reach 95% of exhaustive HV within 200 evaluations, plateauing at 91-95% (similar to rate=50's 94.3%). The convergence curve shows diminishing returns after eval 120-160 as random coverage of the sparse Pareto band saturates."
    mechanism: "With Pareto density <= 4.5% and 11.1% budget coverage (200/1800), random's expected Pareto-optimal discoveries are ~(density × budget) = ~9 configs from 81 Pareto-optimal configs. At rate=100, if density drops further (e.g., to 3%), expected hits drop to ~6. These 6-9 hits provide ~90-94% HV coverage if they span the dominant regions, but reaching 95%+ requires hitting the specific high-impact configs that complete the frontier's coverage — unlikely without directed search."
    diagnostic: "If random DOES reach 95% at rate=100, check whether the Pareto front is more 'convex' at rate=100 (each point contributes more HV independently), making each discovery worth more. Also check if the top 5 configs by individual HV contribution account for >95% of total HV — that would explain random success."

  - type: h-ablation
    prediction: "At rate=75, the convergence gap (NSGA-II minus random to reach 95% of exhaustive) is between the rate=50 gap (~91 evals) and the rate=100 gap. Specifically, rate=75's gap >= 60 evals and the Pareto density at rate=75 is between rate=50's 4.5% and rate=100's density. This confirms monotonic relationship: higher load → lower Pareto density → larger NSGA-II advantage."
    mechanism: "Rate=75 represents an intermediate saturation regime. Configs stressed at rate=100 but fine at rate=50 (e.g., tp=2,inst=2,kv=3000,bs=16: ttft=3399ms at rate=50, ttft=4278ms at rate=75, ttft=4776ms at rate=100) show progressive stress. The intermediate regime produces intermediate Pareto density, which produces intermediate NSGA-II advantage — confirming the causal chain from load → stress → density → algorithm gap."
    diagnostic: "If rate=75's gap is LARGER than rate=100's (non-monotonic), investigate whether rate=100 creates a qualitatively different landscape structure. For instance, rate=100 might create a 'binary' landscape (configs either excellent or terrible, with no gradient) where NSGA-II's crossover cannot exploit gradients between good and moderate configs."
