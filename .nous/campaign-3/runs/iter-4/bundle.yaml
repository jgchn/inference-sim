metadata:
  iteration: 4
  family: "search-space-reduction"
  research_question: "Does removing non-differentiating parameters from the search space amplify NSGA-II's convergence speed advantage over random search, by concentrating crossover on fitness-relevant genes?"

arms:
  - type: h-main
    prediction: "NSGA-II on the reduced 5-parameter space (900 configs) will reach 95% of exhaustive-reference hypervolume at least 80 evaluations (2 generations) before random search. At eval=80, NSGA-II will achieve >= 93% of exhaustive HV while random achieves <= 88%. The convergence speed gap will be larger than the 40-eval gap observed in iteration 3's full-space experiment."
    mechanism: "In the full 9-parameter space, crossover operates on 5 non-differentiating genes (routing, block_size, gpu_mem, and batch>=128 under KV stress which collapses to same outcome). A crossover event that only flips non-informative genes produces an offspring with identical fitness to its parent — a wasted evolutionary step. With 5/9 genes non-informative, ~(5/9)^2 ≈ 31% of crossover events are fully non-productive (both exchanged genes are non-informative). Reducing to 5 parameters where ALL genes are fitness-relevant (tp drives throughput, instances drive GPU count, kv_blocks drive preemption cliff, batch drives scheduling delay, scheduler creates rps/ttft tradeoff under stress) means every crossover has probability ~1 of modifying fitness. This concentrates NSGA-II's exploitation advantage into fewer generations."
    diagnostic: "If NSGA-II does NOT converge faster: (1) Check whether the reduced space Pareto density is still too high (>30%), making even random sufficient. (2) Check whether batch={128,256,512} still collapse to identical outcomes under KV stress (if so, reduce batch options to {32,64,128}). (3) Check whether the tp→instances constraint (inst <= 8/tp) makes the effective space so small that random covers it adequately at 200 evals (200/900 = 22%)."

  - type: h-control-negative
    prediction: "Random search on the reduced space will reach 95% of exhaustive HV later than NSGA-II — specifically at eval=160 or later (vs eval=80 predicted for NSGA-II). Random's final HV at eval=200 will be within 3% of exhaustive HV but below NSGA-II's final."
    mechanism: "Uniform random sampling explores 22% of the 900-config space at budget=200. With estimated ~12% Pareto density cross-tier, random must sample from different GPU tiers AND different kv_blocks cliff positions to build coverage. Without crossover to exploit the tp↔kv_blocks interaction (e.g., inheriting tp=4 from a high-rps parent and kv=3000 from a low-resource parent), random relies on luck to find combinations near the KV cliff for each tier simultaneously."
    diagnostic: "If random converges as fast as NSGA-II: the 200/900 coverage ratio is high enough that random uniformly covers all critical tier×blocks combinations. Would need to either increase space size (add more kv_blocks values) or reduce budget (<100 evals) to create a sharper gap."

  - type: h-robustness
    prediction: "The exhaustive sweep of all 900 reduced-space configs will produce a Pareto front with density between 8% and 25% (72-225 non-dominated solutions out of 900). The true Pareto front will span at least 4 distinct GPU-count tiers (1,2,4,8 GPUs) with genuine tradeoffs within tiers created by the kv_blocks cliff interaction."
    mechanism: "Cross-tier, each (tp, instances) combination occupies a different gpu_count level, creating the primary frontier structure. Within-tier differentiation comes from: (1) kv_blocks below the cliff causes preemptions that trade rps for ttft, (2) batch=32 creates scheduling bottleneck independent of KV stress, (3) scheduler=sjf vs fcfs creates secondary rps/ttft tradeoffs under stress. These three sources of within-tier variation create multiple Pareto points per tier, yielding overall density well below the 65% seen in the 3-obj problem."
    diagnostic: "If Pareto density > 25%: within-tier redundancy is still too high (batch={128,256,512} collapsing). If density < 8%: the space is so constrained that only edge configs (min/max kv_blocks) are Pareto-optimal, meaning intermediate kv_blocks values are always dominated."

  - type: h-ablation
    prediction: "NSGA-II on the full 9-parameter space (25200 configs) will reach 95% of its own final HV at eval=120 — matching the iter-3 result — while NSGA-II on the reduced space reaches 95% of exhaustive HV by eval=80. The 40-eval difference (1 generation) demonstrates the dilution effect of non-informative parameters on crossover efficiency."
    mechanism: "In the full space, crossover must randomly select which of 9 genes to exchange. When operating on non-differentiating genes (routing_policy, block_size, gpu_memory_utilization), the offspring is functionally identical to one parent — no selective pressure is applied. The mutation operator (15% per-gene flip) similarly wastes probability mass on non-informative dimensions. In the reduced space, mutation has 100% chance of modifying a fitness-relevant parameter, making every mutation step productive."
    diagnostic: "If full-space NSGA-II converges faster than expected (< eval=120 for 95%): the RNG seed produced a lucky initial population. Compare seeds or run multiple seeds. If reduced-space NSGA-II is slower than expected: check if pop_size=40 is too large relative to 900-config space (40/900 = 4.4% coverage per generation vs 40/25200 = 0.16% — the reduced space makes each generation proportionally more exploratory)."
