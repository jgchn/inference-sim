metadata:
  iteration: 3
  family: "kv-constrained-search-difficulty"
  research_question: "Does adding total_kv_blocks as a searchable parameter — creating non-linear batch×blocks×TP interactions — produce a genuinely harder multi-objective search problem where NSGA-II outperforms random search?"

arms:
  - type: h-main
    prediction: "NSGA-II with population=40 on the 4-objective space (rps↑, ttft_p99↓, gpu_count↓, kv_blocks↓) will reach 95% of its final 4D hypervolume by generation 2 (eval=80), while random search will not reach 95% until eval=120-160. The convergence gap emerges because NSGA-II's crossover operator can combine 'good TP/instance split' genes from one parent with 'appropriate blocks for that TP' from another, exploiting the non-linear cliff structure. Additionally, NSGA-II will discover at least 30% more non-dominated solutions than random at eval=80."
    mechanism: "The KV blocks cliff creates a non-linear landscape: total_kv_blocks is per-instance (sim/kv/cache.go), so tp=4,i=1 with blocks=5000 has severe stress (77 preemptions) while tp=2,i=2 with the same blocks has zero stress (each instance gets 5000 blocks, totaling 10000). This means the optimal blocks value DEPENDS on the TP/instance split — a conditional relationship that crossover can exploit once the first generation identifies which (tp, blocks) combinations avoid the cliff. Random search cannot concentrate evaluations near the cliff boundary because it samples uniformly, wasting budget on clearly-dominated regions (e.g., tp=1 with blocks=2000 where all metrics are terrible)."
    diagnostic: "If NSGA-II shows no convergence advantage: (1) Check whether the 4D Pareto density is still >30% of configs — if so, the problem remains too easy even with the blocks dimension. (2) Check whether crossover generates many infeasible offspring (TP*inst>8 repairs) wasting evaluations. (3) Check whether the reference point (0, 50000, 9, 11000) is too generous, making HV insensitive to frontier improvements."

  - type: h-control-negative
    prediction: "Random search with 200 evaluations on the 4-objective space will reach 95% of its final hypervolume later than NSGA-II (approximately eval=120-160 vs eval=80), because uniform sampling spreads evaluations across the entire parameter space including clearly-dominated regions. However, random will eventually achieve final HV within 5% of NSGA-II's final HV by eval=200, since 200 evals cover sufficient (tp, blocks) combinations to discover most GPU-tier frontiers."
    mechanism: "With ~15 GPU combos × 6 block levels × 5 batch × 2 scheduler = 900 effective configurations (ignoring non-differentiating params), random at 200 evals covers 22% of the effective space. Many of these 200 will land on dominated configs (e.g., batch=32 always dominated, blocks=2000 at tp=4 severely stressed). The final HV is limited by whether random discovers the narrow sweet spots: tp=4,i=1 at blocks=7500-10000 (Pareto on rps), tp=2,i=2 at blocks=4000-5000 (Pareto on ttft), and the cross-tier frontier points."
    diagnostic: "If random converges as fast as NSGA-II: the 4D Pareto density may still be too high. Count unique non-dominated objective vectors in the combined random sample — if >40% are non-dominated, the problem is still trivially accessible to uniform sampling."

  - type: h-robustness
    prediction: "NSGA-II on the original 3-objective space (1M blocks, no kv_blocks parameter) with budget=200 will reach 95% of final HV within the first generation (eval=40), confirming that the 3-objective problem remains trivially easy at reduced budget. This serves as a control: if the 4-objective problem shows a convergence gap but the 3-objective problem does not, the difficulty is attributable to the blocks×TP interaction, not to algorithm mechanics."
    mechanism: "With 1M default blocks, no KV stress occurs at any configuration. Within each GPU tier, batch≥256 achieves tier-optimal metrics (RP-3), making ~60% of configs Pareto-optimal per tier (RP-1/RP-2). A random population of 40 has >99% probability of covering all 5 GPU tiers and finding a batch≥256 config in each, saturating the frontier immediately."
    diagnostic: "If NSGA-II shows unexpected advantage on 3-obj: check whether the reduced budget (200 vs 550 in iter 2) creates sensitivity to specific frontier corners that random misses (e.g., the 3-GPU tier tp=1,inst=3 which has a narrow optimal window)."
