metadata:
  iteration: 8
  family: "density-gap-universality"
  research_question: "Is Pareto density a universal quantitative predictor of the NSGA-II vs random convergence gap, independent of what causes the density variation (model architecture vs arrival rate)?"

arms:
  - type: h-robustness
    prediction: "Both models at rate=75 will have higher Pareto density than at rate=50: Qwen density > 4.5% (expected ~6.06% from RP-10), Llama density > 5.33%. The rate-increases-density pattern (RP-10) will hold for Llama as well as Qwen, confirming it is model-independent."
    mechanism: "Higher arrival rate (75 vs 50 req/s) increases contention, creating new throughput-vs-cost tradeoff regions. Configs that were dominated at lower load (because they underutilized resources) become Pareto-optimal when the load is high enough that resource-intensive configs saturate. This expands the Pareto frontier regardless of model architecture because the mechanism (queueing pressure revealing cost-performance tradeoffs) is architecture-independent."
    diagnostic: "If Llama density does NOT increase at rate=75 (stays at or below 5.33%): investigate whether Llama's higher throughput ceiling means rate=75 doesn't create enough contention — Llama processes tokens ~50% faster than Qwen, so rate=75 for Llama may be analogous to rate=50 for Qwen in terms of system stress. Check preemption counts and scheduling delays at the worst configs."

  - type: h-main
    prediction: "Qwen3-14B at rate=75 (expected density ~6.06%) will show a NEGATIVE convergence gap: random search reaches 95% of exhaustive HV before NSGA-II (random faster by 10+ evals). The gap will be more negative than Qwen at rate=50 (gap=+4.6) because the higher density reduces NSGA-II's advantage more. NSGA-II will retain a final HV advantage at eval=200 (>99% of exhaustive vs random's ~97-98%)."
    mechanism: "At 6.06% density with 200/1800=11.1% coverage, random search expects ~12 Pareto-optimal hits (200×0.0606=12.1), more than sufficient to reach 95% HV early. NSGA-II's crossover operator exploits the tp×kv×block_size interaction but this exploitation requires multiple generations to propagate good genes through the population. By the time NSGA-II's selection pressure has concentrated on the correct region (gen 2-3), random has already sampled enough Pareto-optimal configs through uniform coverage to exceed 95% HV."
    diagnostic: "If Qwen at rate=75 shows a POSITIVE gap (NSGA-II faster): the landscape at rate=75 may have stronger gradient structure than at rate=50 despite higher density. Investigate whether rate=75 creates sharper KV stress boundaries (more binary dominance relationships) that give NSGA-II's crossover more exploitable structure, offsetting the density disadvantage."

  - type: h-ablation
    prediction: "Llama-3.1-8B at rate=75 will show a NEGATIVE convergence gap, with magnitude comparable to or larger than its rate=50 gap (-22.9 evals). The gap direction confirms that the density>5% → negative gap relationship holds across both rate AND model variation simultaneously. When plotted as (density, gap) alongside the two rate=50 data points, all four points will fall on a monotonically decreasing curve — demonstrating that density is the primary predictor regardless of what produced it."
    mechanism: "Same mechanism as h-main: higher density means random sampling hits Pareto-optimal configs with higher probability, reducing NSGA-II's convergence speed advantage. The additional test here is that changing BOTH model AND rate still produces a gap consistent with the density-only prediction. If model architecture were an independent factor (e.g., Llama's smoother landscape helps NSGA-II regardless of density), the Llama point would deviate from the Qwen-derived density→gap curve."
    diagnostic: "If Llama at rate=75 shows a POSITIVE gap despite density > 5%: the model-specific landscape structure (smoother KV gradient, weaker block_size interaction) may help NSGA-II's crossover operator at higher load where the smoother gradient becomes more useful. Investigate whether Llama at rate=75 has LOWER density than expected (e.g., due to its higher throughput ceiling dominating out more configs at higher load)."
