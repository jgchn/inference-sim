metadata:
  iteration: 9
  family: "landscape-structure-causality"
  research_question: "Does Neighbor Dominance Rate (NDR) — a measure of landscape gradient exploitability — causally determine the NSGA-II vs random convergence gap? Specifically: does removing the KV threshold cliff eliminate NSGA-II's advantage for Qwen, confirming the landscape structure mechanism from RP-14?"

arms:
  - type: h-robustness
    prediction: "Qwen3-14B at rate=100 will have higher overall NDR than Llama-3.1-8B at rate=100, AND the kv_blocks axis will have the highest per-axis NDR for Qwen. This confirms the structural difference (KV threshold sharpness) exists and is measurably concentrated on the kv_blocks parameter. Pareto density will be between 5-8% for both models (consistent with RP-10 trends)."
    mechanism: "At rate=100, KV stress is amplified (Qwen: 108 preemptions at kv=3000 vs 0 at kv=10000; TTFT ratio 122x). This creates many dominance relationships among configs differing only in kv_blocks: the high-kv config dominates the low-kv config on TTFT while being comparable on other objectives. Qwen's slower throughput amplifies this effect more than Llama's faster throughput (83x ratio). The dominance relationships concentrate on the kv_blocks axis, making it the primary contributor to overall NDR."
    diagnostic: "If Qwen NDR <= Llama NDR: the threshold sharpness alone doesn't explain the structural difference. Investigate whether the DISTRIBUTION of dominance across axes (concentration vs uniform) matters more than total NDR. If kv_blocks is NOT the top axis for Qwen: other parameter interactions (tp×instances) might dominate at rate=100; check whether queueing-driven dominance from throughput mismatch becomes the primary mechanism."

  - type: h-main
    prediction: "Qwen3-14B at rate=100 will show a positive NSGA-II convergence gap (NSGA-II reaches 95% exhaustive HV before random). The gap will be >= +31.0 evals (at least as large as rate=75), because higher load intensifies the KV cliff, providing NSGA-II's crossover with a stronger gradient signal on the kv_blocks gene."
    mechanism: "NSGA-II's uniform crossover recombines genes from two parents. When one parent has kv_blocks in the stress regime (kv=2000-4000, high TTFT, dominated) and another has kv_blocks above the threshold (kv>=5000, low TTFT, dominating), offspring inheriting the high-kv gene reliably improve fitness. This directional inheritance effect gives NSGA-II a consistent advantage over random, which samples both sides of the cliff equally. At rate=100, the cliff is sharper (122x TTFT ratio vs ~90x at rate=75), so crossover produces more decisive fitness improvements per generation, accelerating convergence."
    diagnostic: "If gap < +31.0: check whether rate=100 saturates some tiers so completely that even NSGA-II cannot improve beyond its initial random population (if pop=40 already covers all non-dominated tiers, crossover has nowhere to go). If gap < 0 (random wins): the landscape structure hypothesis is wrong for Qwen at extreme load — investigate whether excessive queueing noise at rate=100 creates a multi-modal landscape that traps NSGA-II in local optima."

  - type: h-ablation
    prediction: "Llama-3.1-8B at rate=100 will show a negative NSGA-II convergence gap (random reaches 95% exhaustive HV before NSGA-II). The gap will be comparable to -25.3 evals (rate=75 value), maintaining the Llama-random-wins pattern from RP-11."
    mechanism: "Llama's faster throughput (1.5-1.7x faster token generation than Qwen) means that even with the KV cliff present (83x TTFT ratio), the overall landscape has less NSGA-II-exploitable structure. Llama processes requests quickly enough that queueing effects are weaker and the batch_size/scheduler axes show less differentiation. The dominance relationships are more uniformly distributed across axes (lower concentration), so crossover on any single gene doesn't reliably improve fitness. Random search, which samples uniformly across the entire space, is more efficient at discovering the dispersed Pareto front."
    diagnostic: "If gap > 0 (NSGA-II wins for Llama at rate=100): the rate=100 load may push Llama into a KV-stressed regime severe enough to create exploitable cliff structure. Check Llama preemption counts at rate=100 vs rate=75; if preemptions substantially increase, the landscape may have shifted to Qwen-like structure. This would suggest the Llama-random-wins pattern has a rate-dependent breakpoint."

  - type: h-control-negative
    prediction: "Qwen3-14B at rate=100 in the cliff-free subspace (kv_blocks fixed=10000, 300 configs, 3 objectives) will show convergence gap approximately 0 or negative. Removing the KV threshold cliff eliminates NSGA-II's structural advantage — without the dominant kv_blocks axis providing directional gradient, crossover is no better than random for discovering the 3-objective Pareto front."
    mechanism: "With kv=10000 fixed, all configs have 0 preemptions regardless of TP tier. TTFT differentiation comes only from throughput capacity (tp×instances determines total throughput vs arrival rate=100). This creates a SMOOTH landscape: adjacent configs on tp/instances axes differ by a ratio rather than a cliff (e.g., tp=1→tp=2 roughly doubles throughput, halving TTFT smoothly). In a smooth landscape, crossover doesn't produce reliably better offspring because there are no 'good genes' that consistently indicate the right side of a threshold boundary. NSGA-II degenerates to approximately random search."
    diagnostic: "If gap is strongly positive (NSGA-II still wins): the KV cliff is NOT the only exploitable structure. Investigate whether the tp×instances interaction creates its own gradient (e.g., tp=2,i=2 always dominates tp=4,i=1 due to routing effects). If gap is strongly negative: random's higher diversity may be actively helpful on smooth landscapes — this would support RP-14 from the opposite direction (smooth landscape → random advantage)."
