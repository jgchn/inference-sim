metadata:
  iteration: 5
  family: "rate-regime-transition"
  research_question: "Does bracket K=1 hierarchical search correctly adapt to rate-dependent TP winner transitions? At rate=100 on H100, the TP winner transitions from TP=4 (rate>=150) to TP=8 (rate<=125). Does the same bracket K=1 algorithm identify this shift without modification?"

arms:
  - type: h-main
    prediction: "Bracket K=1 at rate=100 (1000 req, H100 qwen3-14b, blis_seed=42) correctly identifies TP=8/1inst as Phase 1 winner on all 5 search seeds, with evals_to_best=4 (TP=8 is the 4th TP evaluated in the Phase 1 order [TP=1,2,4,8]). Phase 1 max-profile scores: TP1=0.108774, TP2=0.136114, TP4=0.155788, TP8=0.164680. The 1% threshold (0.163033) is only exceeded at eval 4 (TP=8), not at eval 3 (TP=4=0.155788). Phase 2 TPE within TP=8/1inst adds minimal improvement because the max-profile secondary params are already near-optimal for single-instance configs (routing and block_size are degenerate)."
    mechanism: "At low arrival rate (100 req/s), the system is under-saturated: requests arrive slowly enough that queuing pressure is minimal. Under these conditions, per-request throughput dominates over concurrency benefits. TP=8 with 1 instance uses all 8 GPUs for a single instance, maximizing per-request compute bandwidth (highest TFLOPS per request). TP=4 with 2 instances splits GPUs into two smaller instances — each with lower per-request bandwidth. Without queuing pressure to exploit the 2x instance count, the higher per-request throughput of TP=8 wins. The bracket K=1 max-profile (mr=512, mt=8192, pf=4096) creates optimal batching conditions for each TP level, allowing this rate-driven advantage to express cleanly."
    diagnostic: "If Phase 1 selects TP=4 instead of TP=8 at rate=100, check: (1) whether the max-profile routing for 2-instance configs (least-loaded) creates an artificial advantage by load-balancing, (2) whether the fitness weights disproportionately penalize single-instance TTFT at higher batch sizes, (3) whether there is a secondary param combination where TP=4 surpasses TP=8 at rate=100."
    code_changes:
      - file: "search_blis_iter5.py"
        intent: "Add GLOBAL_BEST_TABLE entries for rate=100/1000req on H100: qwen3-14b=0.164680, llama-3.1-8b=0.182394. Add entry for rate=125/1000req on H100: qwen3-14b=0.162182. Update A100-SXM qwen entry from 0.138290 to 0.138820 per iter-4 finding. No algorithmic changes."
        rationale: "The search script needs global_best values for the new rate regimes to compute evals_to_best. The A100-SXM qwen correction was identified in iter-4 but not applied to the iter-6 script."

  - type: h-robustness
    prediction: "Bracket K=1 at rate=100 achieves 25/25 correct Phase 1 identification (TP=8/1inst) across 5 blis_seeds (42-46) x 5 search_seeds (42-46). evals_to_best=4 at all 25 combinations. Per RP-9, Phase 1 is deterministic per blis_seed regardless of search_seed, so all 5 search seeds per blis_seed produce identical Phase 1 results. TP=8 margin ranges from 5.24% (seed=46) to 6.55% (seed=43) — all well above the 1% threshold."
    mechanism: "The under-saturation regime at rate=100 is robust to workload variation across blis_seeds. The 5.24-6.55% TP=8 margin across seeds is large enough that no workload realization can flip the winner. Phase 1 determinism (RP-9) ensures search_seed has no effect on Phase 1 outcomes since bracket profiles are deterministic (no RNG)."
    diagnostic: "If any blis_seed shows TP=4 winning at rate=100, check: (1) whether that seed produces an unusually bursty arrival pattern that creates transient queuing, (2) whether the TP=4/2inst score at max-profile exceeds the TP=8/1inst score for that seed. A single Phase 1 failure across 25 combinations would indicate rate=100 is closer to the crossover than probed."

  - type: h-ablation
    prediction: "Bracket K=1 at rate=125 (crossover point, 1000 req, H100 qwen3-14b) achieves evals_to_best=3 on all 25 combinations (5 blis_seeds x 5 search_seeds), even though the Phase 1 winner is seed-dependent (TP=8 on 4/5 blis_seeds, TP=4 on seed=46). The key insight: at the crossover, TP=4's Phase 1 score (eval 3) already exceeds the 1% threshold because TP=4 and TP=8 are within 1% of each other. Specifically, TP=4 scores range from 0.161052 to 0.166259, all above the threshold of 0.160560 (= 0.99 x 0.162182). The evals_to_best metric is insensitive to which TP level bracket selects at the crossover because both are acceptable."
    mechanism: "At the rate crossover (~125 req/s), the per-request throughput advantage of TP=8 and the concurrency advantage of TP=4/2inst are approximately balanced. The max-profile amplifies both effects equally, resulting in near-identical scores. The 1% threshold in evals_to_best computation absorbs this ambiguity: as long as any config exceeding the threshold is reached, the search is 'successful'. TP=4 at position 3 crosses the threshold before TP=8 at position 4, yielding evals_to_best=3 regardless of which TP level is the true winner."
    diagnostic: "If evals_to_best > 3 at any seed, check: (1) whether TP=4's Phase 1 score fell below the 1% threshold at that seed, which would mean the crossover margin widened enough to separate TP=4 from the acceptable zone, (2) whether the global_best value (0.162182, from seed=42) is too low — seeds with higher absolute scores (seed=45: 0.167234) create a higher threshold that might exclude TP=4."

  - type: h-control-negative
    prediction: "Flat TPE at rate=100 (1000 req, H100 qwen3-14b, blis_seed=42) converges faster than at rate=500: median evals_to_best < 20 across 5 search seeds (compared to median=26 on A100-SXM rate=500 from iter-4). The fitness landscape at rate=100 is monotonically increasing with TP (0.109 -> 0.136 -> 0.156 -> 0.165), meaning TPE's surrogate model can easily learn 'more TP = better'. At rate=500, the landscape is non-monotonic (TP=4 > TP=8), which is harder for TPE to model. Bracket K=1 (evals_to_best=4) still outperforms flat TPE."
    mechanism: "TPE models the objective as a function of the hyperparameters. When the landscape is monotonic in the dominant parameter (TP), the density ratio between good and bad configurations is cleaner, allowing TPE to concentrate sampling on high-TP configurations more quickly. At rate=500, TPE must distinguish between TP=4 (good) and TP=8 (slightly worse) — a non-monotonic relationship that confuses early density estimation."
    diagnostic: "If TPE is slower than predicted (median evals_to_best > 20), check: (1) whether TPE's categorical sampling over the joint (tp, num_instances) index is inefficient at concentrating on high-TP configs, (2) whether degenerate secondary params for TP=8/1inst (routing, block_size no-ops) create confusion in the surrogate model, (3) whether the 5.7% TP=8 margin provides less signal per eval than expected."
