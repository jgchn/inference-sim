metadata:
  iteration: 8
  bundle_ref: "runs/iter-8/bundle.yaml"
  description: >
    Model-size generalization and formula limits. Tests lean bracket on qwen3-32b,
    RP-27 bandwidth formula accuracy across 18 regimes, micro-eval horizon, and L40S robustness.

setup:
  - cmd: "cd /Users/jchen/go/src/inference-sim/inference-sim && go build -o blis main.go"
    description: "Build BLIS binary"
  - cmd: "cp /Users/jchen/go/src/inference-sim/inference-sim/search_blis_iter7.py /Users/jchen/go/src/inference-sim/inference-sim/search_blis_iter8.py"
    description: "Create iter8 script with GLOBAL_BEST_TABLE updates and formula-predict strategy"

arms:
  - arm_id: "h-main"
    conditions:
      - name: "h100-rate100"
        cmd: >
          cd /Users/jchen/go/src/inference-sim/inference-sim &&
          python3 search_blis_iter8.py --strategy adaptive-hierarchical --phase1-k 1
          --phase1-profiles bracket --tp-candidates lean --skip-phase2
          --hardware H100 --budget 2 --seeds 42,43,44,45,46
          --rate 100 --num-requests 1000 --model qwen/qwen3-32b
          --output /Users/jchen/go/src/inference-sim/inference-sim/.nous/-run/runs/iter-8/results/h-main/h100-rate100.json
