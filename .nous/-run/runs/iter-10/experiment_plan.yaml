  bundle_ref: "runs/iter-10/bundle.yaml"
  description: "Workload-shape sensitivity of lean bracket. Tests lean bracket (TP={4,8}, max-profile, budget=2) across 4 workload presets x 2 rates on H100 and A100-SXM. Also tests model-aware formula failure on workload-shifted regimes."

setup:
  - cmd: "cd /Users/jchen/go/src/inference-sim/inference-sim && go build -o blis main.go"
    description: "Build the system"
  - cmd: "cp /Users/jchen/go/src/inference-sim/inference-sim/search_blis_iter8.py /tmp/search_blis_iter10.py"
    description: "Copy iter8 script as base (search_blis_iter10.py already created in-place)"

