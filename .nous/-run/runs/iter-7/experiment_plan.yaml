metadata:
  iteration: 7
  bundle_ref: "runs/iter-7/bundle.yaml"

setup:
  - cmd: "cd /Users/jchen/go/src/inference-sim/inference-sim && go build -o blis main.go"
    description: "Build the BLIS binary"
  - cmd: "git apply /Users/jchen/go/src/inference-sim/inference-sim/.nous/-run/runs/iter-7/patches/h-main.patch"
    description: "Apply h-main patch to create search_blis_iter7.py"

arms:
  # ── h-main: Lean Bracket Accuracy (4 regimes, 5 seeds each) ──────────────
  # Each regime tests whether lean bracket (TP={4,8} max-profile only, budget=2, no Phase 2)
  # achieves within 1% of global best. 5 search seeds should produce identical results
  # (deterministic — no RNG in Phase 1, no Phase 2).

  - arm_id: "h-main"
    conditions:
      # Regime 1: H100 qwen rate=500 (TP=4 winner, evals_to_best=1 predicted)
      - name: "h100-qwen-rate500"
        cmd: >
          cd /Users/jchen/go/src/inference-sim/inference-sim &&
          python3 search_blis_iter7.py --strategy adaptive-hierarchical
          --phase1-k 1 --phase1-profiles bracket --tp-candidates lean --skip-phase2
          --hardware H100 --budget 2 --seeds 42,43,44,45,46
          --blis-seed 42 --rate 500 --num-requests 1000 --model qwen/qwen3-14b
          --output /Users/jchen/go/src/inference-sim/inference-sim/.nous/-run/runs/iter-7/results/h-main/h100-rate500.json
        output: "/Users/jchen/go/src/inference-sim/inference-sim/.nous/-run/runs/iter-7/results/h-main/h100-rate500.json"

      # Regime 2: H100 qwen rate=100 (TP=8 winner, evals_to_best=2 predicted)
