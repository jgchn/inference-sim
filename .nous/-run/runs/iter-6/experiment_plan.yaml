metadata:
  iteration: 6
  bundle_ref: "runs/iter-6/bundle.yaml"
  description: "Cross-hardware rate crossover on A100-SXM: bracket K=1 at rate=100 and rate=200 (crossover)"

setup:
  - cmd: "go build -o blis main.go"
    description: "Build the BLIS binary"
  - cmd: "git apply /Users/jchen/go/src/inference-sim/inference-sim/.nous/-run/runs/iter-6/patches/h-main.patch"
    description: "Apply iter-6 base patch (adds search_blis_iter6.py + llama model config)"

arms:
  - arm_id: "h-main"
    conditions:
      - name: "bracket-k1-a100-qwen-rate100"
        cmd: "python3 search_blis_iter6.py --strategy adaptive-hierarchical --phase1-k 1 --phase1-profiles bracket --hardware A100-SXM --budget 100 --seeds 42,43,44,45,46 --rate 100 --num-requests 1000 --model qwen/qwen3-14b --output /Users/jchen/go/src/inference-sim/inference-sim/.nous/-run/runs/iter-6/results/h-main/results.json"
        output: "/Users/jchen/go/src/inference-sim/inference-sim/.nous/-run/runs/iter-6/results/h-main/results.json"

  - arm_id: "h-robustness"
