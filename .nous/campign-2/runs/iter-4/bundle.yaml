metadata:
  iteration: 4
  family: "phase1-batch-sensitivity"
  research_question: "Does the Phase 1 batch-size profile critically determine tier-ranking correctness across hardware and rate regimes, and can lean Phase 1 (batch=128) + aggressive Phase 2 recover when it happens to select the correct tier?"

arms:
  - type: h-main
    prediction: "On H100 at rate=5000, lean Phase 1 (batch=128, 4 evals) correctly identifies TP=4/2 as the optimal tier, and TPE Phase 2 (46 evals) discovers batch=512 to reach within 1% of the standard Phase 1 score (0.176474). Convergence curve shows Phase 2 improvement from baseline 0.1405 to final >=0.175 as TPE learns the monotone batch->score relationship. evals_to_95pct (within-tier, relative to 0.176474) is <=20 for TPE across all 3 seeds."
    mechanism: "At rate=5000 on H100, the per-instance arrival rate for TP=4/2 (2500 req/s per instance) exceeds single-instance capacity at batch=128 but not at batch=512. However, the RELATIVE ranking between tiers is preserved because ALL tiers are similarly affected by batch=128 bottleneck, and the throughput advantage of TP=4/2 (more total compute bandwidth via 2 instances) still dominates. TPE's surrogate model captures the monotone batch->fitness relationship within 5-10 trials (5 startup + a few directed), concentrating sampling on batch=256/512 and quickly finding the optimum."
    diagnostic: "If lean Phase 1 does NOT identify TP=4/2 at rate=5000 H100 (contradicting probes), check seed sensitivity: verify with seeds 123/456 whether TP=4/2 vs TP=2/4 gap (0.1405 vs 0.1394 = 0.8%) is robust. If TPE fails to reach 95% in 20 evals, check whether the 5,760-config space has deceptive local optima (e.g., scheduler interactions with batch size)."

  - type: h-control-negative
    prediction: "On H100 at rate=500, lean Phase 1 (batch=128) identifies TP=2/4 (score 0.1228) instead of the true optimal tier TP=8/1 (standard Phase 1 score 0.1623). Phase 2 within TP=2/4 cannot recover: the maximum achievable score within TP=2/4 at rate=500 is 0.1228 (batch=128 and batch=512 give identical scores because TP=2/4 is not saturated at rate=500). The final deficit is >=20% below standard Phase 1, regardless of Phase 2 budget."
    mechanism: "At rate=500, TP=2/4 splits load across 4 instances (~125 req/s each), well below each instance's capacity. Neither batch=128 nor batch=512 creates queuing, so both give identical scores. TP=8/1 concentrates all 500 req/s on 1 instance, exceeding its batch=128 capacity but NOT its batch=512 capacity. Standard Phase 1 (batch=512) sees TP=8/1 at full throughput (0.1623); lean Phase 1 (batch=128) sees it throttled (0.1197), making TP=2/4 appear better (0.1228 > 0.1197). Phase 2 within the wrong tier is permanently capped at TP=2/4's ceiling."
    diagnostic: "If lean Phase 1 at rate=500 DOES identify TP=8/1 (contradicting probes), check if seed variation changes the TP=2/4 vs TP=8/1 gap at batch=128 (measured 0.1228 vs 0.1197 = 2.6% margin, small enough that seed might flip it). If the deficit is <20%, verify TP=2/4 ceiling by sweeping all secondary knobs."

  - type: h-ablation
    prediction: "On H100 at rate=5000, lean Phase 1 + LHS Phase 2 converges more slowly to within-tier optimal than lean Phase 1 + TPE Phase 2. Specifically, LHS requires more evaluations than TPE to reach 95% of within-tier optimal (0.95 * 0.176474 = 0.1676) in at least 2 out of 3 seeds. The advantage arises because the dominant Phase 2 dimension (batch: 5 ordered values spanning 0.077-0.176) has a strong monotone signal that TPE exploits, while LHS uniformly covers all 5,760 combinations regardless of signal strength."
    mechanism: "Latin Hypercube Sampling distributes points uniformly across all 8 dimensions (scheduler, batch, routing, max_tokens, block_size, admission, preemption, prefill). With budget=46, LHS evaluates ~46/5760 = 0.8% of the space. The probability of hitting batch=512 (the dominant factor) on any single LHS sample is 1/5 = 20%. TPE's Tree-structured Parzen Estimator builds a density model after 5 startup trials, learns that batch=512 trials dominate the top percentile, and concentrates subsequent sampling on batch=512 + routing=round-robin (the optimal combination)."
    diagnostic: "If LHS outperforms TPE: check whether TPE's startup_trials=5 is insufficient — the surrogate needs to see batch=32 AND batch=512 within startup to learn the monotone relationship. With 5 random trials, P(see both extremes) = 1 - 2*(4/5)^5 + (3/5)^5 = 0.67. If unlucky startup misses batch=512, TPE may explore sub-optimally. Increase n_startup_trials to 8 and retest."

  - type: h-robustness
    prediction: "Standard Phase 1 (batch=512, 4 evals) identifies the correct optimal tier across ALL 6 tested conditions: rate={500, 2000, 5000} x hardware={H100, A100-SXM}. The identified tier is rate-dependent on H100 (TP=8/1 at rate=500, TP=4/2 at rate>=2000) and consistently TP=8/1 on A100-SXM at all rates. Lean Phase 1 (batch=128) fails to identify the correct tier in at least 2 of the 6 conditions. Tier identification is deterministic across seeds (3 seeds give identical rankings) for both strategies."
    mechanism: "Standard Phase 1 with batch=512 provides each tier with sufficient batch capacity to reach its throughput ceiling, allowing the composite fitness to reflect true tier capability. The rate-dependent tier optimality on H100 arises because: at rate=500, a single TP=8 instance (highest per-request parallelism) processes requests fastest when aggregate load is manageable; at rate>=2000, the aggregate throughput advantage of 2 instances (TP=4/2) outweighs the per-request speed advantage of TP=8. On A100-SXM, the lower memory bandwidth shifts the crossover point above rate=5000, so TP=8/1 always dominates in our test range."
    diagnostic: "If standard Phase 1 gives inconsistent tier rankings across seeds for any condition, measure the gap between top-2 tiers. If <1%, the condition is in a 'tie zone' where tier identification is inherently ambiguous (not a failure of the algorithm). If lean Phase 1 succeeds in all 6 conditions (contradicting probes), verify the A100-SXM rate=5000 condition where the gap at batch=128 is 4.4% (TP=4/2: 0.1066 vs TP=8/1: 0.1021)."

# Arms selection rationale:
# - h-main: Tests the positive case (lean Phase 1 correct + TPE Phase 2 effective)
# - h-control-negative: Tests the failure mode (lean Phase 1 wrong, unrecoverable)
# - h-ablation: Isolates TPE advantage over LHS with genuine Phase 2 headroom
# - h-robustness: Validates standard Phase 1 universality across the full rate/hardware matrix
# All four arms are needed because they test complementary aspects of the batch-sensitivity finding.
