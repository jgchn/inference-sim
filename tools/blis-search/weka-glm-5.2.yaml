# zai-org/glm-5.2-fp8 × H100 — CONCURRENCY SWEEP over a REPLAYED agentic trace,
# on a 16-GPU budget.
#
#   trace   tools/blis-search/workloads/weka.{yaml,csv}
#           (TraceV2 v3, mode: generated, session_context_growth: accumulate)
#   source  semianalysisai/cc-traces-weka-with-subagents-051926, via `blis convert weka`
#   model   zai-org/glm-5.2-fp8   hardware  H100   budget  16 GPUs
#   goal    maximize throughput
#
# Derived from tools/blis-search/weka-qwen3-14b.yaml (the Llama-3.1-70B / 8-GPU
# version of this campaign). Same trace, same harness, same shim. Everything
# else is re-derived for this model — none of that file's measured numbers carry
# over, and several of its structural findings INVERT here.
#
# NOTHING IN THIS FILE WAS MEASURED BY RUNNING BLIS. Every quantitative claim
# below is either (a) measured directly on weka.csv, or (b) computed by hand from
# the committed model_configs/glm-5.2-fp8/config.json + hardware_config.json
# through the exact arithmetic in sim/latency/kv_capacity.go. Claims of type (b)
# are labelled DERIVED and are predictions about what blis will do, not
# observations of what it did. The knob VALUE RANGES are therefore unvalidated:
# see UNCALIBRATED NORMALIZERS and step 0 of HOW TO RUN before spending budget.
#
# ═════════════════════════════════════════════════════════════════════════════
# HEADLINE: THE TOPOLOGY SPACE IS A SINGLE POINT — tp16 × dp1 × 1 instance
# ═════════════════════════════════════════════════════════════════════════════
# This campaign was asked to search over tp, dp, and instance count. On 16 H100s
# with this model, that space collapses to exactly one topology. Three
# independent constraints do it, and each is a hard fatal or a silent INVALID
# rather than a soft preference:
#
# 1. MEMORY FLOOR: minimum 10-11 GPUs PER DP RANK.
#    GLM-5.2 is 747.97 B parameters. At `quant_method: fp8` (1 byte/param, per
#    sim/latency/config.go:199) that is 696.61 GiB of weights, which BLIS charges
#    in FULL against every DP rank's TP group (kv_capacity.go:280 —
#    modelWeightBytes is the whole model, and the comment at :302 is explicit
#    that this per-rank overhead is NOT divided by dp). Adding the MoE activation
#    reserve (8.0 GiB) and solving the same minTP formula blis prints on failure:
#
#      gpu_memory_utilization   per-GPU capacity   minimum GPUs per rank
#                       0.85           67.40 GiB                      11
#                       0.90           71.40 GiB                      10
#                       0.95           75.40 GiB                      10
#
#    So any topology with fewer than 10 GPUs in a single TP group is the hard
#    fatal "model overhead (…) exceeds available GPU memory … Minimum GPUs
#    required per instance: N".
#
# 2. TP DIVISIBILITY: tp must divide num_attention_heads = 64.
#    trained_physics_model.go:594 rejects NumHeads % TP != 0 (and :602 the same
#    for NumKVHeads = 64). The divisors of 64 that are <= 16 are {1,2,4,8,16}.
#    Intersected with the >= 10 floor from (1): **tp = 16 is the only legal TP**.
#    tp 10, 11, 12, 14 are not merely untried — they are rejected by the latency
#    model. tp 8 does not fit the weights.
#
# 3. GPU BUDGET: tp × dp × instances <= 16.
#    With tp pinned at 16 this forces dp = 1 and instances = 1. There is no
#    2-instance option (that needs 32 GPUs), and no dp > 1 option (each extra DP
#    rank needs its own 10+ GPUs on top of the first rank's 16).
#
# CONSEQUENCE FOR THE THREE REQUESTED DIMENSIONS:
#   * tp        — 1 legal value (16). Declared in `infrastructure.tp`.
#   * instances — 1 legal value (1). Follows from gpu_budget // tp.
#   * dp        — 1 legal value (1). Declared as a pinned parameter below, WITH
#                 the constraint that would enforce the budget if it were ever
#                 unpinned, so a future edit at a larger budget is one line.
#
# This is a real answer to the question, not a failure to search: on 16 H100s
# GLM-5.2 has exactly one deployable shape, and the throughput question becomes
# "what load and what scheduling policy extract the most from that shape". The
# rest of this space is built for that question. If you want the topology
# comparison the request implies, raise the budget — see RAISING THE BUDGET.
#
# A SECOND CONSEQUENCE: replicas == 1 makes the entire ROUTING subsystem inert.
# The sampler forces round-robin at one instance and the scorer subsystem is
# gated off by `replicas > 1`, so routing_policy, snapshot_refresh_interval and
# every scorer profile are provable no-ops. The reference file kept them to
# characterize its 2-instance topology; here there is no 2-instance topology, so
# they are omitted outright rather than burning budget on a dimension that
# cannot move a metric.
#
# ═════════════════════════════════════════════════════════════════════════════
# THE 300-SECOND ROUND DEADLINE — READ THIS BEFORE READING ANY FRONT
# ═════════════════════════════════════════════════════════════════════════════
# This is the first-order effect in this campaign and it has no CLI flag.
#
# The trace's deadline_us column is 0 in all 37,732 rows (measured), so round 0
# of every session has no deadline. But closed-loop FOLLOW-UP rounds are given a
# deadline by BLIS itself: sim/workload/session.go:322 calls computeDeadline with
# the blueprint's Timeout, and the TraceV2 loader never sets Timeout, so it is
# nil and generator.go:815 applies `arrival + DefaultTimeoutUs` with
# DefaultTimeoutUs = 300_000_000 µs (generator.go:806). Every follow-up round
# therefore expires 300 SIMULATED SECONDS after it arrives, and a timeout
# CANCELS THE REST OF ITS SESSION (session.go:117).
#
# Why that binds hard HERE and did not on Llama-70B: contexts. The reconstructed
# per-session peak prompt on this corpus (measured, compaction-aware — see TRACE
# PROPERTIES) is p50 221,381 / p90 574,479 / max 952,674 tokens. A DERIVED
# order-of-magnitude for prefill of a 250k-token prompt on 16 H100s is ~12 s at
# the FP8 peak (1,979 TFLOPS × 16 × mfuPrefill 0.45) and ~24 s at the bf16 peak
# (989.5 TFLOPS), attention-dominated (attention FLOPs go as S², and at S = 250k
# they are ~15× the MLP term). At S = 952k the same arithmetic gives ~166 s /
# ~330 s. Those are UNQUEUED, whole-cluster figures.
#
# So: the largest rounds sit at or past the 300 s deadline before any queueing at
# all, and at concurrency > 1 queueing is what decides. Expect timed_out_requests
# to be the dominant failure counter, expect it to rise steeply with concurrency,
# and expect every timeout to delete a long tail of that session's remaining
# rounds (sessions here run to 1,991 rounds).
#
# THE TRAP THIS SETS FOR A THROUGHPUT OBJECTIVE: a config that times out more
# rounds serves a SMALLER, CHEAPER population, and can post a HIGHER
# tokens_per_sec for that reason alone. tokens_per_sec is
# total_output_tokens / runtime (sim/metrics.go:153) — it does not know that the
# denominators differ. Therefore:
#
#   ** NEVER read tokens_per_sec off this front without reading
#      timed_out_requests and completed_requests next to it. **
#
# Both are in `secondary_metrics` and both are written to every result record.
# The two objectives alone cannot protect you from this; only the secondary
# columns can. If you want the search itself to enforce it, add an SLO gate:
#   --slo "timed_out_requests<50"
# (filter_by_slo accepts any key present in the metrics JSON, so this works with
# no change to the space; pick the threshold after the step-0 probe).
#
# There is no flag to raise the 300 s default. Changing it means editing
# DefaultTimeoutUs, or teaching the TraceV2 loader to carry a per-client Timeout.
# Both are out of scope for a search space; the honest move is to report the
# amputation, not to hide it.
#
# ═════════════════════════════════════════════════════════════════════════════
# HOW TO RUN
# ═════════════════════════════════════════════════════════════════════════════
# STEP 0 — TIME ONE EVAL BEFORE COMMITTING BUDGET. Do not skip this.
# evaluator.evaluate_config swallows subprocess.TimeoutExpired as `return None`,
# which is indistinguishable from an invalid config, so an under-set
# --eval-timeout does not merely lose evals: it BIASES the sweep systematically,
# because the slowest configs are exactly the high-concurrency, high-context ones
# the sweep exists to characterize. This model's eval cost is UNCHARACTERIZED
# (see EVAL COST below for why it may be large). Measure it:
#
#   go build -o blis main.go
#   time ./blis replay \
#     --trace-header tools/blis-search/workloads/weka.yaml \
#     --trace-data   tools/blis-search/workloads/weka.csv \
#     --model zai-org/glm-5.2-fp8 --hardware H100 --tp 16 --dp 1 \
#     --latency-model trained-physics --seed 42 \
#     --max-model-len 1048576 --concurrent-sessions 4 --total-sessions 32 \
#     --shuffle-corpus --max-num-batched-tokens 8192 \
#     --metrics-path /tmp/glm-probe.json
#
# Then set --eval-timeout to at least 4× that wall clock (the concurrency-32 rung
# and the 2048-batched-tokens corner are both much heavier than concurrency 4),
# and sanity-read /tmp/glm-probe.json: tokens_per_sec and ttft_p99_ms from this
# probe are what you use to calibrate `hypervolume_reference` (below).
#
# STEP 1 — the campaign. `evaluator.py` hardcodes `[blis_binary, "run"]`, so
# point --blis-binary at the shim: it rewrites the subcommand to `replay` and
# strips the four run-only flags. Run from the repo root — `blis replay` resolves
# --defaults-filepath from cwd, so ./defaults.yaml must exist.
#
#   python3 tools/blis-search/search.py \
#     --model zai-org/glm-5.2-fp8 --hardware H100 \
#     --search-space tools/blis-search/weka-glm-5.2.yaml \
#     --budget 200 --workers 4 --eval-timeout <4x step 0> \
#     --strategy random \
#     --blis-binary tools/blis-search/blis-replay-shim.sh \
#     --output weka-glm-5.2.json --output-all --verbose
#
# --strategy random, NOT the default diversity. Phase 2's diversity sampler
# targets under-represented GPU-COUNT tiers, and this space has exactly one
# (gpus_used == 16), so `missing_classes` is empty on the first front,
# `all_found` is immediately true, and Phase 2 silently degenerates to the random
# sampler anyway. Passing --strategy random says so out loud instead.
#
# --workers 4, not 8. Each eval holds a 16-GPU instance's worth of KV
# bookkeeping — up to 374,761 blocks at gpu_memory_utilization 0.95 — and the
# contexts here are ~1000× a synthetic spec. Raise it only after step 0 shows the
# per-eval RSS.
#
# --model resolves via cmd/hfconfig.go:288 bundledModelConfigDir, which keeps
# only the part AFTER the "/" and looks for model_configs/<that>/config.json. So
# the org prefix is free-form but `glm-5.2-fp8` must match the directory name
# exactly (case-sensitive). The model is absent from defaults.yaml's model map,
# which is fine — resolution falls through to model_configs/ — but it means there
# is no committed alpha/beta calibration for it; step time comes from
# trained-physics basis functions.
#
# --workload/--rate/--num-requests are NOT required and should be OMITTED. This
# space declares a `--trace-header` parameter, which search.py detects as trace
# mode: the three flags become optional, are dropped from `fixed_params`, and so
# never reach the shim. The trace governs arrivals entirely. Provenance is
# per-config in the output (`pareto_front[].config.trace_header` / `.trace_data`),
# not in `spec`.
#
# NOTE: load_search_space() is a bare yaml.safe_load — there is no schema
# validation. A misspelled knob name or flag is silently ignored, not rejected.
# After editing, re-check with:
#   cd tools/blis-search && python3 -c "import search_space as s; \
#     sp=s.load_search_space('weka-glm-5.2.yaml'); \
#     print(sorted(s.get_all_param_flags(sp).values()))"
#
# ═════════════════════════════════════════════════════════════════════════════
# DERIVED MODEL FACTS (model_configs/glm-5.2-fp8/config.json + H100 calib)
# ═════════════════════════════════════════════════════════════════════════════
# Shape: 78 layers, hidden 6144, 64 attention heads, head_dim 192, vocab 154,880,
# intermediate_size 12,288, MoE with n_routed_experts 256 (+1 shared) at
# moe_intermediate_size 2048, num_experts_per_tok 8, first_k_dense_replace 3,
# max_position_embeddings 1,048,576. MLA: kv_lora_rank 512, qk_rope_head_dim 64.
# Compute dtype bfloat16 (read from the `dtype` key — config.go:277 has an
# explicit GLM-5 fallback for it), weights fp8.
#
# WEIGHTS — 747.97 B params ⇒ 696.61 GiB at 1 byte/param.
#   computeModelWeightBytes with the dense-prefix split (F3): 3 dense layers at
#   intermediate_size 12,288 + 75 MoE layers at 256 × 2048 per-expert, plus the
#   shared expert, router, attention, norms, embeddings and an untied lm_head.
#
# KV — 89,856 bytes PER TOKEN, and NOT divided by TP.
#   MLA path (kv_capacity.go:112): (kv_lora_rank + qk_rope_head_dim) × layers ×
#   BytesPerParam = 576 × 78 × 2. One latent per token per layer, replicated
#   across TP ranks, independent of num_kv_heads and head_dim.
#
#   >>> THE ~TPx KV OVERCOUNT DOES NOT APPLY TO THIS MODEL. <<<
#   The known BLIS overcount (verified ~4.05× vs vLLM at TP=4) comes from the
#   STANDARD MHA/GQA path, which divides per-token bytes by tp
#   (kv_capacity.go:147) while the memory budget is separately multiplied by tp
#   (:277) — a double count that grows with TP. The MLA path returns the full
#   latent width with no /tp, exactly matching vLLM's replicated MLA cache, so
#   the capacity numbers below are honest in that respect. This is the one place
#   where a GLM-5.2 study is on FIRMER ground than the Llama-70B version of this
#   campaign, where the overcount was a 2× bias between its tp4 and tp8 rows.
#
# KV CAPACITY AT tp16 (per CalculateKVBlocks, weights + 8.0 activation + 0.6×16
# non-torch = 714.21 GiB of overhead against 80 × util × 16 GiB):
#
#   util   allocatable   blocks @16   total tokens   sessions at p50 / p90 / max peak
#   0.85     373.79 GiB      279,164      4,466,624        20.2 /  7.8 / 4.7
#   0.90     437.79 GiB      326,963      5,231,408        23.6 /  9.1 / 5.5
#   0.95     501.79 GiB      374,761      5,996,176        27.1 / 10.4 / 6.3
#
#   (Total tokens are block-size-invariant to within one block, so the same
#   ceiling holds at block_size 32/64/128.)
#
# THREE PREDICTIONS THAT SHAPE THE SPACE:
#
# P1. max_model_len 1,048,576 SERVES THE WHOLE CORPUS. The largest reconstructed
#     prompt is 952,674 tokens and ZERO of 219 sessions exceed 1,048,576, which
#     is also the model's own max_position_embeddings. And 1,048,576 sits far
#     below the KV-feasible ceiling at every util in this space (4.47 M tokens at
#     the tightest), so blis will not silently cap it. Expect
#     dropped_unservable ≈ 0.
#
#     This INVERTS the reference campaign's finding E. There, a 128k ceiling on
#     Llama-3.1-70B amputated 180 of 219 sessions and inflated rps by ~57% for
#     that reason. Here there is no amputation-by-ceiling at all — which is
#     precisely why the 300 s DEADLINE (above), not the length cap, becomes the
#     amputation mechanism to watch.
#
# P2. KV BINDS AROUND CONCURRENCY 8-16, so preemption is a live mechanism here.
#     At util 0.90 the instance holds 5.23 M tokens; 9.1 sessions at the p90 peak
#     or 5.5 at the maximum peak fill it. The reference campaign measured
#     preemption_count == 0 almost everywhere and concluded KV pressure never
#     forced eviction; do NOT carry that over. Read preemption_count and
#     kv_allocation_failures on every result, and expect the concurrency knee to
#     land between 8 and 16 rather than at 32.
#
# P3. THE MoE PARALLELISM KNOBS ARE DEAD, and not for budget reasons.
#     --enable-expert-parallel has no step-time effect at all: routed-expert
#     weight and compute are scoped to the flattened moeGroup = TP·DP, which is
#     EP-mode-agnostic, and trained_physics_model.go:160 says so explicitly
#     ("EnableExpertParallel therefore has no step-time effect today").
#     --moe-comm-backend gates on DP > 1 (root.go:761 warns "has no effect at
#     --dp=1"), and dp is pinned at 1 by the memory floor. Both are omitted.
#
# DOCUMENTED OPTIMISM IN THE ABOVE (all of it makes blis look BETTER than the
# real deployment, so treat front entries as upper bounds):
#   * Block-wise FP8 (`weight_block_size: [128,128]`) is modelled as a flat
#     1 byte/param — the per-block scales and any modules_to_not_convert are not
#     charged, so 696.61 GiB is a floor on the real weight footprint.
#   * The DSA indexer (index_head_dim 128, index_n_heads 32, index_topk 2048) is
#     unmodelled — both its weights and its per-token cache. On a 1 M-token
#     context that cache is not negligible, so the KV ceilings above are
#     optimistic.
#   * MLA's attention weight projections (q_lora_rank 2048, kv down/up) are not
#     separately modelled in the weight estimate.
#   * num_nextn_predict_layers 1 (MTP / speculative decode) is out of scope
#     (#1528): no speculative throughput gain is modelled.
#   * tp16 spans two 8-GPU nodes in reality. BLIS models no inter-node TP
#     bandwidth penalty, so the step time is that of an impossible single
#     16-GPU NVLink domain.
#
# ═════════════════════════════════════════════════════════════════════════════
# EVAL COST — WHY STEP 0 EXISTS
# ═════════════════════════════════════════════════════════════════════════════
# Measured on weka.csv: the corpus carries 186.5 M input-delta tokens and 29.0 M
# output tokens, but ALSO 11,444 compaction-reset rounds whose recorded absolute
# inputs sum to 2.84 BILLION tokens (mean 248,562 per reset round). Re-seeding at
# a compaction boundary intentionally breaks prefix identity (#1609), so those
# rounds re-prefill from scratch: DERIVED total prefill work is ~3.0 B tokens for
# the full 219-session corpus, ~13.9 M per session.
#
# The simulator's wall clock tracks STEP COUNT and BLOCK HASHING, not FLOPs. At
# block_size 16 that prefill volume implies on the order of 10^8 block hashes for
# the full corpus. That is the reason `total_sessions` is 32 here and not the
# reference's 100, the reason block_size 128 is in the space, and the reason the
# eval timeout must be measured rather than guessed.
#
# THE LOAD LADDER: 32 → 64 → 100 sessions. Start at 32. Raise it only after step
# 0 shows headroom, and remember that raising it also raises the top legal
# concurrency rung (the `concurrent_sessions <= total_sessions` constraint) — a
# concurrency above total_sessions is the hard fatal "Failed to build session
# pool: total (N) must be >= concurrent (M)", which evaluator.py records as a
# silent INVALID.
#
# ═════════════════════════════════════════════════════════════════════════════
# TRACE PROPERTIES — measured on weka.csv (37,732 rows), not inherited
# ═════════════════════════════════════════════════════════════════════════════
#   37,732 rows · 219 sessions · rounds/session p50 107, p90 369, max 1,991
#   input_tokens (DELTAS)  p50    137  p90  2,535  p99 150,088  max 824,580
#   output_tokens          p50    317  p99  7,551  max  36,498
#   reconstructed prompt   p50 221,381  p90 574,479  p99 897,390  max 952,674
#     (per-session peak, replaying accumulate + input_tokens_reset semantics)
#   sessions whose peak exceeds  131,072 → 180/219 ;  1,048,576 → 0/219
#
# Six properties decide what is worth searching:
#
# 1. session_context_growth: accumulate — per-round input_tokens are DELTAS, not
#    absolute prompts. Fixed replay is REJECTED by blis with a fatal error;
#    closed-loop is mandatory. `--concurrent-sessions` (below) implies it.
#
# 2. COMPACTION-AWARE conversion. 11,444 of 37,732 rows (30.3%) carry an
#    `input_tokens_reset` marker, so this CSV was converted by a post-#1609 build
#    and accumulate replay re-seeds its buffer at each compaction boundary. An
#    older conversion lacking that column over-counts context by ~3-4×. If you
#    re-convert the corpus, re-measure everything in this file.
#
# 3. think times are CLIPPED at 30 s — 3,558 rows (9.4%) sit exactly at
#    30,000,000 µs, so the corpus was converted with `--max-think-time 30s`
#    rather than the uncapped 0 that CLAUDE.md recommends for weka. Effective
#    load is therefore somewhat higher than the real capture. Harmless for
#    ranking configs against each other; do not read absolute throughput as a
#    property of the real workload. 219 rows (one per session, i.e. round 0) have
#    an empty think cell.
#
# 4. prefix_group and prefix_length are EMPTY in all 37,732 rows — the conversion
#    did not carry the dataset's KV block hashes into TraceV2. Cache reuse is
#    real but arises purely from session context accumulation. Irrelevant to
#    routing here (one instance), but it does mean cache_hit_rate reflects
#    within-session reuse only.
#
# 5. slo_class is EMPTY in all rows, and `model` is empty by design (routing
#    safety). Every request lands in the default class, so every tier-aware knob
#    is a provable no-op and is omitted below (see OMITTED KNOBS).
#
# 6. deadline_us and send_time_us are 0 in all rows; status is "ok" everywhere;
#    streaming is false; the multimodal token columns and reason_ratio are 0.
#    The all-zero deadline_us is what makes the synthesized 300 s follow-up
#    deadline (above) the ONLY timeout mechanism in play.
#
# ═════════════════════════════════════════════════════════════════════════════
# OMITTED KNOBS — structurally inert, measured dead upstream, or unsafe
# ═════════════════════════════════════════════════════════════════════════════
# INERT AT replicas == 1 (the only legal instance count)
#   --routing-policy                the sampler forces round-robin at one
#     --routing-scorers             instance and the scorer subsystem is gated
#     --snapshot-refresh-interval   off by `replicas > 1`. All 1,295 scorer
#     --cache-signal-delay          profiles are provable no-ops. This is the
#     --counterfactual-k            single biggest difference from the reference
#                                   file, which spent most of its budget on this
#                                   half of the space to characterize tp4 × 2.
#   --pd-* / --prefill-instances    P/D needs >= 2 instances = >= 32 GPUs.
#     --decode-instances
#
# INERT FOR THIS MODEL / dp (verified in source, not assumed)
#   --enable-expert-parallel        no step-time effect by construction
#                                   (trained_physics_model.go:160)
#   --moe-comm-backend              gates on DP > 1 (root.go:761); dp is pinned
#
# INERT ON THIS TRACE
#   --admission-policy tier-shed /  slo_class is empty trace-wide: one band, so
#     gaie-legacy, --scheduler       nothing to shed, rank, or gate. Only
#     priority-fcfs / reverse-       fcfs vs sjf discriminates here.
#     priority, --fairness-policy,
#     --slo-targets, --dispatch-order
#   --preemption-policy priority     ranks victims by SLO tier; one band ⇒
#                                    degenerates to a tie-break reshuffle. Left
#                                    out for the same reason as the SLO
#                                    schedulers — but unlike the reference
#                                    campaign, preemption is EXPECTED to be
#                                    non-zero here (P2), so if preemption_count
#                                    is large on the front this is the first
#                                    knob worth probing by hand.
#   --flow-control and every gateway admission is always-admit and a closed pool
#     knob (--saturation-detector,   never builds a gateway queue
#     --queue-depth-threshold, …)
#   --encode-*                       image/audio/video token columns are all 0
#   --lora-* / lora-affinity         no adapter column in the corpus
#
# STRUCTURALLY UNAVAILABLE ON A SIM-GENERATED REPLAY TRACE
#   --kv-offload-config             HARD ERROR: "the trace was captured without a
#     (and every kv_offload knob)   kv_offload config; --kv-offload-config cannot
#                                   add one on replay of a sim-generated trace
#                                   (INV-13)". weka.yaml is mode: generated and
#                                   on replay the header is authoritative, so
#                                   offload can never be a search DIMENSION on
#                                   this corpus — only a property baked in at
#                                   capture/convert time. For 250k-1M token
#                                   contexts this is the single largest untapped
#                                   subsystem and it deserves its own
#                                   experiment: re-capture via `blis observe`
#                                   (mode: real) or re-convert with the config.
#   --kv-cpu-blocks (legacy tier)   Runs, but the reference campaign measured
#     and its three companions      three probes each exceeding 55 MINUTES
#                                   against a 3-7 min baseline (>10×) on a much
#                                   smaller model. At any sane --eval-timeout
#                                   every CPU-tier config here would time out and
#                                   be recorded as a silent INVALID.
#   --routing-latency,              physical constants, not deployment choices
#     --admission-latency
#   --total-kv-blocks               would pin capacity by hand, but the MLA path
#                                   is not subject to the ~TPx overcount (see
#                                   DERIVED MODEL FACTS), so auto-sizing is
#                                   trustworthy here and a literal override would
#                                   only fight gpu_memory_utilization, which IS
#                                   a searched knob.
#
# UNSAFE FOR A THROUGHPUT OBJECTIVE (would game it by amputating the workload)
#   --request-ttl, --queue-shedding, --in-flight-eviction, --admission-policy
#   token-bucket / reject-all, and any LOWER --max-model-len: every one of these
#   cancels, rejects or drops requests, and a cancelled round ends its session
#   (up to 1,991 remaining rounds), so a config can "win" on tokens_per_sec by
#   serving a smaller, cheaper population. The 300 s deadline already injects
#   this failure mode involuntarily; do not add more of it as a knob.
#
# ═════════════════════════════════════════════════════════════════════════════
# HARNESS FOOTGUNS THIS FILE DELIBERATELY AVOIDS
# ═════════════════════════════════════════════════════════════════════════════
# Four are live bugs in the reference file; do not reintroduce them.
#
# H1. EXACTLY TWO OBJECTIVES. pareto.compute_hypervolume_2d returns 0.0 when
#     len(objectives) != 2 (pareto.py:50). With three objectives the HV
#     trajectory is identically zero, so detect_convergence fires at the first
#     window and Phase 1 "converges" immediately having learned nothing. The
#     reference file declares three (tokens_per_sec, completed_requests,
#     gpus_used) and therefore runs with a dead convergence detector.
#
# H2. hypervolume_reference KEYS MATCH objectives KEYS EXACTLY. search.py:330
#     falls back to a silent 100000.0 for any objective missing from the block.
#     The reference file's objectives name `tokens_per_sec` while its
#     hypervolume_reference names `responses_per_sec`, so its primary axis is
#     normalized by 100000.0 and contributes essentially no hypervolume.
#
# H3. `values:` (PLURAL), ALWAYS. search_space.get_param_values reads `values`
#     only; a `value:` key silently drops the entire parameter, and there is no
#     schema validation to catch it. This is how --max-model-len failed to reach
#     blis for several reference campaigns.
#
# H4. ONLY REAL SCHEDULER NAMES. sim/bundle.go:132 admits exactly fcfs,
#     priority-fcfs, sjf, reverse-priority. The reference file's prose says it
#     reverted away from the invalid `priority`, but its `scheduler.values` still
#     lists it — every sample drawing it is a hard fatal recorded as INVALID.
#     This file uses [fcfs, sjf].
#
# H5. gpus_used IS NOT AN OBJECTIVE, and here it also is not a FACT.
#     generate_topologies computes gpus_used as tp × replicas and ignores dp
#     entirely (search_space.py:52), so if dp is ever unpinned the reported
#     gpus_used will UNDERCOUNT by a factor of dp. The `tp * dp * replicas <= 16`
#     constraint below is what actually enforces the budget; gpus_used is
#     reporting only. It is kept out of `objectives` both for that reason and
#     because a minimize-GPUs axis lets a 2×-GPU config displace a tied cheaper
#     one on the front. At one topology it is a constant anyway.
#
# ═════════════════════════════════════════════════════════════════════════════
# RAISING THE BUDGET — how to make the requested tp/dp/instance search real
# ═════════════════════════════════════════════════════════════════════════════
# Every line below is a one-line edit; the constraint already handles the budget.
#
#   32 GPUs → tp: [16], instances 1-2, dp 1-2. The FIRST budget at which any of
#             the three requested dimensions has more than one legal value. It
#             gives a genuine three-way comparison: tp16 × 2 instances (router
#             replicas, routing becomes live again) vs tp16 × dp2 × 1 instance
#             (one engine, 2× KV, MoE dispatch cost switches on and
#             --moe-comm-backend stops being a no-op) vs tp32 × 1 (32 divides 64,
#             so it is legal). Set `gpu_budget: 32`, `tp: [16, 32]`,
#             `dp: values: [1, 2]`, and change the constraint's literal to 32.
#   16 GPUs, smaller model → the topology space opens immediately. GLM-5.2's
#             10-GPU-per-rank floor is what closes it; a model that fits in 2-4
#             GPUs restores the full tp × instances grid on the same trace.
#   16 GPUs, this model, honest dp → would require BLIS to shard expert weights
#             across DP ranks in the capacity model. It does not
#             (computeModelWeightBytes always charges all 256 experts), so dp > 1
#             is infeasible here BY MODEL, not only by hardware. Real vLLM with
#             EP+DP does shard them; if that is the deployment you care about,
#             file it as a capacity-model gap rather than working around it with
#             a hand-set --total-kv-blocks.
#
# ═════════════════════════════════════════════════════════════════════════════

infrastructure:
  gpu_budget: 32
  # tp 16 is the ONLY legal value, on two independent grounds (see HEADLINE):
  #   * memory floor — 696.61 GiB of fp8 weights + 8.0 GiB activation need >= 10
  #     GPUs per DP rank at util 0.90 (11 at 0.85). tp 1/2/4/8 are hard fatals:
  #     "model overhead (…) exceeds available GPU memory … Minimum GPUs required
  #     per instance: 10".
  #   * divisibility — trained_physics_model.go:594 requires
  #     num_attention_heads (64) % tp == 0, so only {1,2,4,8,16} are legal at all.
  # The intersection is {16}. Listing anything else here would burn budget on
  # configs evaluator.py records as INVALID without saying why.
  tp: [8, 16]
  min_instances: 1
  # gpu_budget // tp == 1, so this yields exactly one topology:
  # {tp: 16, replicas: 1, gpus_used: 16}.
  explore_pd: false

parameters:
  # ── Workload injection: the trace itself ───────────────────────────────────
  # Single-valued on purpose — injection points, not search dimensions. These
  # replace `workload_spec` (--workload-spec does not exist on `blis replay`).
  trace_header:
    flag: "--trace-header"
    values: ["tools/blis-search/workloads/weka.yaml"]

  trace_data:
    flag: "--trace-data"
    values: ["tools/blis-search/workloads/weka.csv"]

  # ── Data parallelism: PINNED, and pinned on evidence ──────────────────────
  # dp > 1 is infeasible on this budget for a reason that is about the MODEL, not
  # just the GPU count: BLIS charges the FULL 696.61 GiB weight footprint against
  # EVERY DP rank (kv_capacity.go:302 — per-rank overhead is deliberately not
  # divided by dp, because each rank is an independent vLLM EngineCore on its own
  # TP GPUs). Each rank therefore needs its own >= 10 GPUs, so dp 2 needs >= 20
  # and the budget is 16.
  #
  # Kept as an explicit parameter rather than dropped, for three reasons: it
  # answers the dimension that was asked for; it makes `--dp 1` appear in every
  # recorded command line so the topology is unambiguous in the output; and the
  # constraint below already enforces tp × dp × replicas <= gpu_budget, so
  # widening this list is the only edit needed at a larger budget.
  #
  # Note that dp is invisible to the harness's own GPU accounting — see footgun
  # H5. The constraint, not gpus_used, is what keeps the budget honest.
  dp:
    flag: "--dp"
    values: [1, 2, 4, 8, 16]

  # ── Context ceiling ───────────────────────────────────────────────────────
  # 1,048,576 = the model's own max_position_embeddings, and it serves the WHOLE
  # corpus: the largest reconstructed prompt is 952,674 tokens and 0 of 219
  # sessions exceed the cap (measured). It is also far below the KV-feasible
  # ceiling at every gpu_memory_utilization in this space (4.47 M tokens at the
  # tightest, util 0.85), so blis will not silently cap it down.
  #
  # This is a CEILING, not a reservation — lowering it would only convert
  # servable rounds into dropped_unservable ones and cancel their sessions, which
  # is exactly the amputation-as-fake-throughput failure mode. Single-valued so
  # it stays constant across the campaign; never compare absolute throughput
  # across two campaigns run at different ceilings.
  max_model_len:
    flag: "--max-model-len"
    values: [1048576]

  # ── THE LOAD DIMENSION ────────────────────────────────────────────────────
  # Closed-loop, so throughput measures how fast rounds actually clear (real
  # capacity) rather than "did it keep up with an offered rate"; concurrency is
  # the pool size that sets the offered load. Read the resulting front as a
  # CAPACITY CURVE, not as a config ranking — on a maximize-throughput front the
  # highest non-collapsing concurrency wins almost regardless of the other knobs.
  # To compare POLICY knobs instead, re-pin this to one rung and re-run.
  #
  # DERIVED expectation: the knee lands at 8-16, not 32. Two ceilings arrive
  # together there — KV (5.23 M tokens at util 0.90 holds ~9 sessions at the p90
  # peak context, ~5.5 at the maximum) and the 300 s per-round deadline. Expect
  # preemption_count and timed_out_requests to both turn on across 8 → 16, and
  # expect completed_requests to fall while tokens_per_sec may still rise.
  #
  # The top rung is bounded by total_sessions: concurrency > total_sessions is a
  # HARD FATAL ("total (32) must be >= concurrent (64)") that dies in 0.1 s and is
  # recorded as a silent INVALID. The constraint below enforces the relationship
  # so a future edit to either list cannot poison the campaign.
  concurrent_sessions:
    flag: "--concurrent-sessions"
    values: [1, 2, 4, 8, 16, 32]

  # 32, NOT the reference's 100 — see EVAL COST. The corpus holds 219 sessions so
  # 32 needs no duplication. Raising it improves metric stability, raises the top
  # legal concurrency rung, and increases eval wall clock roughly linearly.
  # Ladder: 32 → 64 → 100, gated on the step-0 timing probe.
  total_sessions:
    flag: "--total-sessions"
    values: [10]

  # Seeded-random corpus subset + admission order. With total_sessions 32 < the
  # corpus's 219, the UNSHUFFLED default takes a deterministic PREFIX of the
  # corpus, making the measured load point a property of corpus ORDER; shuffling
  # draws a seeded-random 32-of-219 instead. Requires --concurrent-sessions > 0
  # (hard error otherwise), which every rung above satisfies.
  #
  # Boolean, single-valued: evaluator.build_command emits a bare flag for True and
  # omits it entirely for False, so `values: [true]` pins it on. NOT a search
  # dimension — the subset is held fixed so configs are compared on one
  # population. The permutation is seeded from --seed, so it is identical across
  # every config in a campaign. CHANGING --seed CHANGES THE SUBSET, so results
  # are not comparable across seeds.
  shuffle_corpus:
    flag: "--shuffle-corpus"
    values: [true]

  # ── Instance scheduling ───────────────────────────────────────────────────
  # Batch-slot ceiling. Inert below concurrency 32 in a closed pool (at most
  # `concurrent_sessions` requests can be in flight), so read this knob only on
  # the 16 and 32 rungs. 8 is included so the ceiling can bind BELOW the pool
  # size on purpose — with 250k-1M token contexts, deliberately capping
  # co-resident sequences is a plausible way to keep KV from thrashing, which
  # makes this a real policy lever here rather than the near-dead knob it was on
  # a 14B model.
  max_num_seqs:
    flag: "--max-num-seqs"
    values: [8, 16, 32, 64, 256]

  # Per-step prefill token budget: how fast a round's prefill clears. THE scalar
  # knob to watch. This corpus is prefill-dominated to an extreme degree —
  # ~3.0 B DERIVED prefill tokens against 29.0 M output tokens — and a 952k-token
  # prompt is 116 chunks at 8192 but only 8 at 131072. The range is extended well
  # past the reference's 32768 top end for exactly that reason; blis's own default
  # is 2048, which is kept as the low anchor.
  max_scheduled_tokens:
    flag: "--max-num-batched-tokens"
    values: [2048, 8192, 16384, 32768, 65536, 131072]

  # Chunked-prefill trigger. 0 = never chunk on length. On the reference model
  # chunking these huge prefills measured costly (-31% rps at 2048); the values
  # here are scaled to this corpus's context lengths rather than that model's.
  # Constrained below to stay under max_scheduled_tokens, which is the only
  # regime where the threshold means anything.
  long_prefill:
    flag: "--long-prefill-token-threshold"
    values: [0, 8192, 32768, 131072]

  # Input length spans four orders of magnitude (137 → 824,580 deltas; 221k → 952k
  # reconstructed), so shortest-job-first has real material. fcfs vs sjf is the
  # only discriminating pair on this corpus — priority-fcfs and reverse-priority
  # both rank by SLO tier and slo_class is empty in all 37,732 rows, so they
  # degrade to fcfs. `priority` is NOT a valid name (footgun H4).
  scheduler:
    flag: "--scheduler"
    values: [fcfs, priority]

  # Prefix-reuse granularity, and here also a SIMULATOR COST knob. At block_size
  # 16 a 952k-token prompt is 59,542 blocks to hash and account for, and the
  # corpus implies ~10^8 block hashes; 128 cuts that by 8× at the price of
  # coarser reuse (a partially-matching 128-token block is a full miss). The
  # total-token KV ceiling is block-size-invariant, so this trades cache
  # resolution against bookkeeping, not capacity. 128 is the least-exercised
  # value in BLIS — if it produces suspiciously round cache_hit_rate values,
  # drop it before trusting it.
  block_size:
    flag: "--block-size-in-tokens"
    values: [16, 32, 64, 128]

  # Directly sets the KV ceiling, which BINDS in this campaign (P2): 4.47 M /
  # 5.23 M / 6.00 M tokens at 0.85 / 0.90 / 0.95. That is a 34% capacity spread
  # across this list, i.e. roughly the difference between 5 and 6 maximum-context
  # sessions co-resident. Unlike on the reference model, where it was a low-TP-only
  # lever, it is a first-class knob here.
  #
  # NOTE 0.95 is retained but is NOT deployable in practice — it deadlocks
  # CUDA-graph capture at high TP on real hardware, and BLIS has no failure mode
  # that represents this. Treat a front entry that wins at 0.95 as unrealizable,
  # and check whether the 0.90 entry beside it is close enough to ship.
  gpu_memory_utilization:
    flag: "--gpu-memory-utilization"
    values: [0.85, 0.90, 0.95]

constraints:
  # THE REAL GPU BUDGET. generate_topologies enforces tp × instances <= gpu_budget
  # but computes gpus_used as tp × replicas and ignores dp entirely
  # (search_space.py:52), so dp is invisible to it. This constraint is what keeps
  # the budget honest, and it is the only line that needs its literal changed
  # when gpu_budget changes. Evaluated in infrastructure mode via
  # is_valid_config → eval_condition, with tp/dp/replicas all present in cfg.
  - "tp * dp * replicas <= 16"
  # A threshold at or above the per-step budget can never trigger.
  - "long_prefill == 0 or long_prefill < max_scheduled_tokens"
  # blis fatals when the pool target is smaller than the concurrency ("total (32)
  # must be >= concurrent (64)") and evaluator.py cannot tell that fatal from an
  # invalid config. Enforce it in the sampler.
  - "concurrent_sessions <= total_sessions"

# No conditional_subsystems block: the only one this harness supports is
# routing_scorers, whose enabled_when requires `replicas > 1`. There is no legal
# multi-instance topology on this budget, so every scorer profile is a provable
# no-op. See OMITTED KNOBS.

# No diversity_safe block: it only feeds DiversityBiasedSampler, which targets
# under-represented GPU-count tiers. This space has exactly one (16), so Phase 2
# degenerates to random sampling — run with --strategy random and say so.

objectives:
  # EXACTLY TWO, and they must oppose each other (footgun H1: hypervolume is 0.0
  # for any other count, which silently kills convergence detection).
  #
  # tokens_per_sec is total_output_tokens / runtime (sim/metrics.go:153) — the
  # DECODE-side throughput, which is the literal reading of "maximize
  # throughput". It does not count prefill work, and on this corpus prefill is
  # ~100× the output volume, so it is a narrow measure of a broad cost. Read
  # responses_per_sec (round completion rate, in secondary_metrics) beside it:
  # for an agentic workload a completed ROUND is the unit of user-visible work.
  #
  # ttft_p99_ms is the price axis, and it is the honest one here: throughput on
  # this corpus is bought almost entirely with prefill queueing delay. Pairing
  # them makes the front a real capacity curve — each concurrency rung shows its
  # throughput and what that throughput cost in tail latency.
  #
  # NEITHER OBJECTIVE PROTECTS AGAINST AMPUTATION. The 300 s round deadline
  # cancels sessions, and a cancelled session both raises tokens_per_sec and
  # LOWERS ttft_p99_ms, so it looks like a Pareto improvement on both axes.
  # timed_out_requests and completed_requests are the only defence; they are in
  # secondary_metrics and in every result record. Consider gating the search with
  # --slo "timed_out_requests<N" once step 0 tells you a sane N.
  - metric: tokens_per_sec
    direction: maximize
  - metric: gpus_used
    direction: minimize

# NOTE: no script in tools/blis-search reads this block — the evaluator returns
# every numeric key in the metrics JSON regardless. It documents what to READ,
# and what --slo may reference (filter_by_slo accepts any key present in the
# metrics JSON).
secondary_metrics:
  # The amputation guards. Read these FIRST, before either objective.
  - timed_out_requests      # DERIVED to be the dominant failure mode (300 s deadline)
  - completed_requests
  - dropped_unservable      # DERIVED ~0 at max_model_len 1048576; a non-zero value
                            # means the ceiling or a KV cap is amputating after all
  # The other throughput reading: completed rounds per second.
  - responses_per_sec
  # Latency detail behind the ttft_p99_ms objective.
  - e2e_p99_ms
  - ttft_mean_ms
  - itl_mean_ms
  - scheduling_delay_p99_ms
  # KV pressure — DERIVED to bind at concurrency 8-16 (P2), unlike the reference
  # campaign where preemption was 0 almost everywhere.
  - preemption_count
  - kv_allocation_failures
  - cache_hit_rate          # *float64 with omitempty: may be absent from the JSON
  # Prefill volume actually simulated — the denominator that tokens_per_sec omits,
  # and the direct readout of how much compaction recompute a config paid for.
  - total_input_tokens
  - total_output_tokens

hypervolume_reference:
  # Normalizers, NOT nadir points: pareto.py DIVIDES by these. There must be an
  # entry for EVERY metric in `objectives` and the keys must match EXACTLY —
  # search.py:330 falls back to a silent 100000.0 otherwise (footgun H2).
  #
  # >>> UNCALIBRATED. These are DERIVED order-of-magnitude placeholders, not
  # >>> measurements, because no blis run was permitted for this file. Replace
  # >>> them after the step-0 probe and before reading any hypervolume
  # >>> trajectory or convergence verdict.
  #
  # tokens_per_sec 2000.0 — DERIVED from the decode roofline: at large batch the
  # per-GPU per-step weight read at moeGroup 16 is ~43.6 GiB, which at H100's
  # 3.35 TB/s is ~14 ms per decode step, so ~2,285 output tok/s at a batch of 32
  # is a ceiling. Achieved throughput will be far below it because runtime is
  # prefill-dominated, so this normalizer is deliberately generous: a config
  # better than every probe should still land under 1.0 without clipping.
  #
  # ttft_p99_ms 600000.0 (600 s) — DERIVED from the deadline structure. Round 0
  # has no deadline, so its TTFT is unbounded; follow-up rounds expire at 300 s.
  # 2× the deadline gives headroom for round-0 tails. For a MINIMIZE objective
  # pareto.py computes max(0, (ref - v) / ref), so any p99 at or above this
  # contributes ZERO hypervolume — if step 0 shows p99 near or past 600 s, RAISE
  # this or the whole front will normalize flat and convergence will fire early.
  #
  # Both are regime-specific. Re-calibrate if you change max_model_len,
  # total_sessions, the concurrency ladder, shuffle_corpus, or --seed.
  tokens_per_sec: 2000.0
  ttft_p99_ms: 600000.0
