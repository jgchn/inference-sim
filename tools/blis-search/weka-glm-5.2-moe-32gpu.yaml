# zai-org/glm-5.2-fp8 × H100 — MoE PARALLELISM SEARCH on a 32-GPU budget.
#
#   trace   tools/blis-search/workloads/weka.{yaml,csv}  (TraceV2 v3, accumulate)
#   model   zai-org/glm-5.2-fp8   hardware  H100   budget  32 GPUs
#   goal    maximize throughput, with tp / dp / instances as REAL dimensions
#
# COMPANION TO tools/blis-search/weka-glm-5.2.yaml (the 16-GPU version). That file
# is the correct spec for a 16-GPU budget, where the topology space is a single
# point and every MoE parallelism knob is provably inert. THIS file exists because
# 32 GPUs is the smallest budget at which dp, the MoE comm backend, and multi-
# instance routing all become live at once. Read the sibling file for the full
# model derivation, trace properties, the 300 s round-deadline warning, and the
# omitted-knob inventory — none of that changes here and it is not repeated.
#
# NOTHING IN THIS FILE WAS MEASURED BY RUNNING BLIS. Every number is measured on
# weka.csv or hand-computed from model_configs/glm-5.2-fp8/config.json +
# hardware_config.json through the arithmetic in sim/latency/kv_capacity.go, and
# every claim about which knob is live is read out of the step-time model source.
# Claims labelled DERIVED are predictions, not observations.
#
# ═════════════════════════════════════════════════════════════════════════════
# WHAT EACH MoE KNOB ACTUALLY DOES — verified in source, not from flag help
# ═════════════════════════════════════════════════════════════════════════════
# The three flags are usually named together, but they are in three different
# states. Getting this wrong wastes budget on byte-identical duplicates.
#
# --dp — LIVE at dp > 1, and it is the gate for everything else.
#   Two mechanisms switch on together at dp > 1:
#     * STEP TIME: `tMoEDispatch` (trained_physics_model.go:385, `if m.isMoE &&
#       m.dp > 1`) charges the MoE dispatch/combine all-to-all under β_EP. At
#       dp == 1 the mutually exclusive `tMoEReduce` branch fires instead (:376,
#       `dp == 1 && tp > 1`) — a plain TP all-reduce over the MoE FFN. The two
#       gates are exhaustive, so MoE-FFN comm is charged exactly once either way,
#       but by a DIFFERENT basis.
#     * KV CAPACITY: `CalculateKVBlocks` multiplies the final block count by dp
#       for an MoE model (kv_capacity.go:361), because each DP rank is an
#       independent EngineCore with its own full KV budget.
#   COST: each rank is charged the FULL 696.61 GiB weight footprint
#   (kv_capacity.go:302 is explicit that per-rank overhead is NOT divided by dp),
#   so every DP rank needs its own >= 10 GPUs. dp 2 needs >= 20. THAT is why the
#   16-GPU spec pins dp at 1, and why this file needs 32.
#
# --moe-comm-backend — LIVE ONLY AT dp > 1, and only TWO distinct behaviours.
#   Its sole consumer is `moeDispatchBasis`, which is called only from the
#   `dp > 1` branch above. At dp == 1 the flag cannot change step time at all —
#   root.go:761 emits exactly that warning ("has no effect at --dp=1").
#   The seven accepted names collapse to two volume families
#   (sim/latency/moe_comm_backend.go:42):
#     commFamilyAllGather  {naive, allgather_reducescatter}
#       dense per-token hidden states, NO top_k factor → volume ∝ tokens·hidden
#     commFamilyAll2All    {pplx, deepep_high_throughput, deepep_low_latency,
#                           mori, flashinfer_all2allv}
#       top_k point-to-point routing → volume ∝ tokens·top_k·hidden
#   Within a family the names are BYTE-IDENTICAL — same family, same basis, same
#   β_EP. So this space carries exactly TWO representatives, one per family.
#   Searching all seven would spend 5/7 of the budget re-running duplicates.
#   DERIVED: with num_experts_per_tok = 8, the all2all family moves ~8× the
#   dispatch volume of allgather, so allgather should win on step time here and
#   the interesting question is by how much at dp 2.
#
# --enable-expert-parallel — DEAD AT EVERY dp. NOT IN THIS SPACE.
#   Its only consumer in the entire repo is `ModelHardwareConfig.EffectiveEP()`
#   (sim/config.go:233), and `grep -rn "EffectiveEP()" --include=*.go .` returns
#   ZERO call sites outside that definition. trained_physics_model.go:160 states
#   the reason: routed-expert weight and compute are scoped to the flattened
#   `moeGroup = TP·DP`, which is deliberately EP-mode-agnostic (EP-off
#   tensor-shards experts, EP-on owns whole experts — identical per-GPU bytes),
#   and the dispatch gate is DP > 1, not EP. The flag validates (it fatals on a
#   dense model and requires trained-physics) and then affects nothing.
#
#   It is omitted as a DIMENSION because it would double the space for
#   byte-identical output. It IS worth one PROBE, as a determinism control — if
#   these two differ in any metric, that is a bug worth filing, not a knob:
#
#     for ep in "" "--enable-expert-parallel"; do
#       ./blis replay --trace-header tools/blis-search/workloads/weka.yaml \
#         --trace-data tools/blis-search/workloads/weka.csv \
#         --model zai-org/glm-5.2-fp8 --hardware H100 --tp 16 --dp 2 $ep \
#         --latency-model trained-physics --seed 42 --max-model-len 1048576 \
#         --concurrent-sessions 4 --total-sessions 32 --shuffle-corpus \
#         --metrics-path "/tmp/ep${ep:+-on}.json"
#     done
#     diff /tmp/ep.json /tmp/ep-on.json && echo "EP inert, as expected"
#
#   Also note --enable-expert-parallel does NOT reduce per-rank weight bytes:
#   computeModelWeightBytes always multiplies by the full NumLocalExperts (256),
#   with no EP or DP scoping. Real vLLM with EP+DP does shard expert weights
#   across ranks; BLIS's capacity model does not. That gap is the whole reason
#   dp > 1 costs a fresh 10+ GPUs per rank instead of being nearly free. If the
#   EP+DP-sharded deployment is what you care about, file it as a capacity-model
#   gap — do not work around it with a hand-set --total-kv-blocks, which would
#   silently decouple capacity from the topology being compared.
#
# ═════════════════════════════════════════════════════════════════════════════
# THE TOPOLOGY SPACE — FOUR points, and they are three different bets
# ═════════════════════════════════════════════════════════════════════════════
# tp must divide num_attention_heads = 64 (trained_physics_model.go:594) AND be
# >= 10 to hold the weights, so tp ∈ {16, 32}. With tp × dp × instances <= 32:
#
#   topology       gpus  per-instance KV blocks / tokens (util 0.90, block 16)
#   tp16 dp1 × 1     16     326,963  =  5,231,408    ← 16-GPU BASELINE
#   tp16 dp1 × 2     32     326,963  =  5,231,408    ← SCALE-OUT (2 replicas)
#   tp16 dp2 × 1     32     653,926  = 10,462,816    ← DATA-PARALLEL
#   tp32 dp1 × 1     32   1,180,163  = 18,882,608    ← SCALE-UP (pure TP)
#
# THE HEADLINE DERIVED FINDING: at a fixed 32 GPUs, TP SCALE-UP GIVES 1.8× THE KV
# OF EITHER OTHER OPTION — 18.9 M tokens against 10.5 M. The reason is the weight
# footprint: 696.61 GiB is charged ONCE per DP rank and ONCE per instance, so
# tp16×2 and tp16 dp2 both pay it twice (1,393 GiB of the 2,304 GiB budget) while
# tp32 pays it once. On a corpus whose per-session peak context reaches 952,674
# tokens, KV is the binding resource (see the sibling file's P2), so this is
# DERIVED to decide the campaign.
#
# That prediction is the point of the search. Each option buys something
# different, and only tp32 buys KV:
#   * tp16 × 2 replicas — the only option where ROUTING is live. Two instances
#     means the scorer subsystem ungates (`replicas > 1`), so session affinity vs
#     load balancing becomes a real tradeoff. But KV is PARTITIONED: a single
#     952k-token session must fit in ONE instance's 5.23 M tokens, and no amount
#     of routing merges the two pools.
#   * tp16 dp2 × 1 — one router endpoint, 2× aggregate KV, and the MoE
#     dispatch/combine cost switches on (so --moe-comm-backend starts to matter).
#     vLLM splits requests disjointly across DP ranks, so KV is partitioned here
#     too, but the split is internal rather than routed.
#   * tp32 × 1 — no routing, no dispatch cost, 3.6× the baseline KV, and the
#     worst step-time story: tpAllReduceBasis grows with tp, and BLIS models NO
#     inter-node bandwidth penalty even though tp32 spans four 8-GPU nodes. Treat
#     its step time as optimistic in a way the other two are not.
#
# So the front answers: does the extra KV of scale-up beat the extra parallelism
# of scale-out/data-parallel, on a workload with million-token contexts? Read the
# 16-GPU baseline out of `all_results` (it is DERIVED to be dominated on the
# front) to get the 16 → 32 GPU scaling ratio.
#
# ═════════════════════════════════════════════════════════════════════════════
# READING THE OUTPUT — gpus_used IS WRONG IN THIS SPACE
# ═════════════════════════════════════════════════════════════════════════════
# generate_topologies computes gpus_used as tp × replicas and IGNORES dp entirely
# (search_space.py:52). So `tp16 dp2 × 1` reports gpus_used == 16 while actually
# consuming 32. The `tp * dp * replicas <= 32` constraint below is what enforces
# the budget; gpus_used is reporting only, and here it is reporting a falsehood
# for exactly one of the four topologies.
#
# NEVER group results by gpus_used in this campaign. Derive the true count from
# the config triple instead:
#
#   jq -r '.all_results[] | [(.config.tp * .config.dp * .config.replicas),
#          .config.tp, .config.dp, .config.replicas, .config.concurrent_sessions,
#          .metrics.tokens_per_sec, .metrics.ttft_p99_ms,
#          .metrics.timed_out_requests, .metrics.completed_requests,
#          .metrics.preemption_count] | @tsv' weka-glm-5.2-moe-32gpu.json \
#     | sort -k1,1n -k5,5n
#
# This also breaks Phase 2's diversity sampler, which targets under-represented
# gpus_used tiers: it sees tiers {16, 32} where the truth is {16, 32, 32, 32}, so
# it will chase a "16-GPU" tier that is half fictional. Run with
# --strategy random and skip Phase 2 entirely.
#
# ═════════════════════════════════════════════════════════════════════════════
# HOW TO RUN
# ═════════════════════════════════════════════════════════════════════════════
# STEP 0 — TIME ONE EVAL FIRST, on the HEAVIEST topology (tp32, which has 3.6× the
# baseline KV bookkeeping). evaluator.evaluate_config swallows TimeoutExpired as
# `return None`, indistinguishable from an invalid config, so an under-set
# --eval-timeout silently deletes the configs the sweep exists to compare.
#
#   go build -o blis main.go
#   time ./blis replay \
#     --trace-header tools/blis-search/workloads/weka.yaml \
#     --trace-data   tools/blis-search/workloads/weka.csv \
#     --model zai-org/glm-5.2-fp8 --hardware H100 --tp 32 --dp 1 \
#     --latency-model trained-physics --seed 42 \
#     --max-model-len 1048576 --concurrent-sessions 8 --total-sessions 32 \
#     --shuffle-corpus --max-num-batched-tokens 8192 \
#     --metrics-path /tmp/glm32-probe.json
#
# Set --eval-timeout to >= 4× that, and replace the hypervolume_reference values
# below with this probe's tokens_per_sec and ttft_p99_ms.
#
# STEP 1 — the campaign. Run from the repo root (blis replay resolves
# --defaults-filepath from cwd, so ./defaults.yaml must exist). --blis-binary
# MUST be the shim: evaluator.py hardcodes `[blis_binary, "run"]` and the shim
# rewrites it to `replay`.
#
#   python3 tools/blis-search/search.py \
#     --model zai-org/glm-5.2-fp8 --hardware H100 \
#     --search-space tools/blis-search/weka-glm-5.2-moe-32gpu.yaml \
#     --budget 300 --workers 4 --eval-timeout <4x step 0> \
#     --strategy random \
#     --blis-binary tools/blis-search/blis-replay-shim.sh \
#     --output weka-glm-5.2-moe-32gpu.json --output-all --verbose
#
# --budget 300, up from the 16-GPU file's 200: four topologies and a live routing
# subsystem is a materially larger space. Omit --workload/--rate/--num-requests
# (trace mode drops them). After editing this file, re-check the resolved flags:
#   cd tools/blis-search && python3 -c "import search_space as s; \
#     sp=s.load_search_space('weka-glm-5.2-moe-32gpu.yaml'); \
#     print(sorted(s.get_all_param_flags(sp).values()))"
#
# ═════════════════════════════════════════════════════════════════════════════

infrastructure:
  gpu_budget: 32
  # tp is constrained on two independent grounds, both hard failures:
  #   * memory floor — 696.61 GiB fp8 weights + 8.0 GiB activation need >= 10 GPUs
  #     per DP rank at util 0.90 (11 at 0.85). tp 8 is a hard fatal even at util
  #     1.0 (8 × 80 = 640 GiB < 704.61 GiB).
  #   * divisibility — trained_physics_model.go:594 requires
  #     num_attention_heads (64) % tp == 0, so only {1,2,4,8,16,32,64} are legal.
  # Intersection within budget: {16, 32}.
  tp: [16, 32]
  min_instances: 1
  # Yields tp16 × {1,2} and tp32 × {1}. Crossed with dp below and filtered by the
  # tp × dp × replicas <= 32 constraint, that is 4 feasible topologies.
  #
  # explore_pd stays false: P/D would split the 2-instance option into
  # prefill/decode pools, which is a different experiment. It also cannot be
  # combined honestly with dp here, since gpus_used already miscounts dp.
  explore_pd: false

parameters:
  # ── Workload injection: the trace itself (single-valued) ───────────────────
  trace_header:
    flag: "--trace-header"
    values: ["tools/blis-search/workloads/weka.yaml"]

  trace_data:
    flag: "--trace-data"
    values: ["tools/blis-search/workloads/weka.csv"]

  # ── THE MoE PARALLELISM DIMENSION ─────────────────────────────────────────
  # This is the knob the 16-GPU spec had to pin. At dp 2 two things switch on
  # together: the MoE dispatch/combine all-to-all in step time
  # (trained_physics_model.go:385) and a 2× KV block count (kv_capacity.go:361).
  # It also makes --moe-comm-backend meaningful for the first time.
  #
  # dp 2 is the ceiling on this budget: each rank carries the FULL weight
  # footprint and so needs its own >= 10 GPUs, i.e. dp 3 at tp 16 would need 48.
  # The constraint below enforces it against tp and replicas jointly, which is
  # necessary because the harness's own gpus_used ignores dp entirely.
  dp:
    flag: "--dp"
    values: [1, 2]

  # ── MoE dispatch/combine volume family ────────────────────────────────────
  # TWO values, not the seven blis accepts, because the seven collapse to two
  # volume families and within a family the step time is byte-identical
  # (sim/latency/moe_comm_backend.go:42):
  #   allgather_reducescatter — commFamilyAllGather, vLLM's DEFAULT. Dense
  #     per-token hidden states, no top_k factor. `naive` is the same family.
  #   deepep_high_throughput  — commFamilyAll2All. top_k point-to-point routing,
  #     so DERIVED ~8× the dispatch volume at num_experts_per_tok = 8. pplx,
  #     deepep_low_latency, mori and flashinfer_all2allv are the same family and
  #     would be exact duplicates of this row.
  #
  # INERT AT dp == 1 by construction (its only consumer, moeDispatchBasis, is
  # called only under `dp > 1`), so half of every value's samples are wasted.
  # That is accepted rather than fixed: the harness has no mechanism to condition
  # a `parameters` entry on another parameter's value (conditional_subsystems
  # supports only its own fixed subsystem names), so the alternatives are to
  # accept the duplication or to drop dp 1 and lose the baseline. If budget is
  # tight, run this file twice with dp pinned instead.
  #
  # Read this knob ONLY on the dp 2 rows. A dp 1 pair differing only here must be
  # byte-identical; if it is not, that is a bug.
  moe_comm_backend:
    flag: "--moe-comm-backend"
    values: [allgather_reducescatter, deepep_high_throughput]

  # ── Context ceiling ───────────────────────────────────────────────────────
  # 1,048,576 = the model's max_position_embeddings, and it serves the whole
  # corpus (largest reconstructed prompt 952,674 tokens; 0 of 219 sessions
  # exceed it). Below the KV-feasible ceiling at every topology here, the
  # tightest being tp16 dp1 at util 0.85 (4.47 M tokens), so blis never silently
  # caps it. Single-valued: a lower ceiling only converts servable rounds into
  # dropped_unservable ones and cancels their sessions.
  max_model_len:
    flag: "--max-model-len"
    values: [1048576]

  # ── Load dimension ────────────────────────────────────────────────────────
  # Closed-loop, so throughput measures how fast rounds actually clear. DERIVED:
  # the knee should now sit HIGHER than the 16-GPU spec's 8-16, because three of
  # the four topologies double or triple aggregate KV — that shift is itself a
  # result worth reporting. Bounded above by total_sessions (a higher concurrency
  # is the hard fatal "total (32) must be >= concurrent (N)", recorded as a
  # silent INVALID); the constraint below enforces it.
  concurrent_sessions:
    flag: "--concurrent-sessions"
    values: [1, 2, 4, 8, 16, 32]

  total_sessions:
    flag: "--total-sessions"
    values: [32]

  # Seeded-random 32-of-219 subset instead of a deterministic corpus prefix, so
  # the load point is not a property of corpus ORDER. Single-valued (bare flag
  # for true, omitted for false), held fixed so all configs are compared on one
  # population. Changing --seed changes the subset.
  shuffle_corpus:
    flag: "--shuffle-corpus"
    values: [true]

  # ── Instance scheduling ───────────────────────────────────────────────────
  max_num_seqs:
    flag: "--max-num-seqs"
    values: [8, 16, 32, 64, 256]

  # Per-step prefill budget — the dominant scalar knob on this prefill-heavy
  # corpus (~3.0 B DERIVED prefill tokens vs 29.0 M output tokens). A 952k-token
  # prompt is 116 chunks at 8192 but 8 at 131072.
  max_scheduled_tokens:
    flag: "--max-num-batched-tokens"
    values: [2048, 8192, 16384, 32768, 65536, 131072]

  long_prefill:
    flag: "--long-prefill-token-threshold"
    values: [0, 8192, 32768, 131072]

  # fcfs vs sjf is the only discriminating pair: priority-fcfs and
  # reverse-priority rank by SLO tier and slo_class is empty in all 37,732 rows.
  # `priority` is NOT a valid name (sim/bundle.go:132) and would be a hard fatal.
  scheduler:
    flag: "--scheduler"
    values: [fcfs, sjf]

  # Prefix-reuse granularity and a simulator-cost knob: at block_size 16 a 952k
  # prompt is 59,542 blocks to hash. The total-token KV ceiling is
  # block-size-invariant, so this trades cache resolution against bookkeeping.
  block_size:
    flag: "--block-size-in-tokens"
    values: [16, 32, 64, 128]

  # Directly sets the KV ceiling, which binds here. NOTE 0.95 is NOT deployable
  # in practice (it deadlocks CUDA-graph capture at high TP) and BLIS has no
  # failure mode for it — treat a front entry that wins at 0.95 as unrealizable.
  gpu_memory_utilization:
    flag: "--gpu-memory-utilization"
    values: [0.85, 0.90, 0.95]

  # ── Routing: LIVE for the first time, at the tp16 × 2 topology only ───────
  # The 16-GPU spec omits all of this because replicas == 1 forces round-robin
  # and gates the scorer subsystem off. Here the 2-replica topology ungates it,
  # so session affinity vs load balancing becomes a real tradeoff — and this
  # corpus makes it a sharp one, since sessions accumulate to ~950k tokens and
  # sending a follow-up round to the other instance discards that entire prefix.
  # Both knobs are inert on the three single-instance topologies; the sampler
  # overrides routing_policy to round-robin there automatically.
  routing_policy:
    flag: "--routing-policy"
    values: [round-robin, least-loaded, weighted]

  # Freshness of the load-based routing signals (QueueDepth/BatchSize/
  # KVUtilization; INV-7). Included on measured evidence from the Llama-70B
  # campaign, where 0 (immediate) was one of the largest single-knob effects
  # (-32.6% rps / +57% ttft_p99 vs the 50 ms default) because fresher signals
  # make routing chase instantaneous state and break session affinity. Inert at
  # replicas == 1.
  snapshot_refresh_interval:
    flag: "--snapshot-refresh-interval"
    values: [0, 25000, 50000, 100000]

constraints:
  # THE REAL GPU BUDGET, and the only place dp is counted. generate_topologies
  # enforces tp × instances <= gpu_budget but computes gpus_used as tp × replicas
  # with no dp term (search_space.py:52), so without this line a tp16 dp2 × 2
  # config (64 GPUs) would sample as legal. Change only this literal and
  # infrastructure.gpu_budget when the budget changes.
  - "tp * dp * replicas <= 32"
  # A chunked-prefill threshold at or above the per-step budget can never fire.
  - "long_prefill == 0 or long_prefill < max_scheduled_tokens"
  # blis fatals when the pool target is below the concurrency, and evaluator.py
  # cannot tell that fatal from an invalid config.
  - "concurrent_sessions <= total_sessions"

conditional_subsystems:
  # Ungated only by the tp16 × 2 topology. Scorer WEIGHTS are the high-resolution
  # part of routing — on the Llama-70B campaign ppc:2 vs ppc:3 was the difference
  # between 3 and 110 preemptions — so weights run 1-5. With 4 scorers that is
  # sum over r of C(4,r)·5^r = 1,295 profiles.
  #
  # DERIVED for this corpus: precise-prefix-cache should dominate, because a
  # session's ~950k-token accumulated context is worth far more than any load
  # imbalance it creates. The load-only scorers (active-requests, load-balance)
  # are deliberately absent: they were probed on the Llama-70B campaign and
  # reproduced plain least-loaded to within 1% rps with identical completed
  # requests, i.e. they duplicate a routing_policy value already in the space.
  #
  # Note the offload tiers are invisible to precise-prefix-cache by design
  # (GetCachedBlocks is GPU-only), but offload is unavailable on this trace
  # anyway — see the sibling file's OMITTED KNOBS.
  routing_scorers:
    enabled_when: "routing_policy == 'weighted' and replicas > 1"
    flag: "--routing-scorers"
    format_b:
      scorers: [precise-prefix-cache, queue-depth, kv-utilization, no-hit-lru]
      weights: [1, 2, 3, 4, 5]

diversity_safe:
  # Only consulted by DiversityBiasedSampler, which this campaign should not use
  # (--strategy random) because gpus_used miscounts dp. Kept so that a future
  # diversity run holds routing at a known-safe value while it chases topologies.
  routing_policy: [round-robin, least-loaded, weighted]

objectives:
  # EXACTLY TWO: pareto.compute_hypervolume_2d returns 0.0 for any other count
  # (pareto.py:50), which would zero the HV trajectory and make convergence
  # detection fire immediately having learned nothing.
  #
  # gpus_used is deliberately NOT an objective. Two reasons here: it undercounts
  # dp (see READING THE OUTPUT), and a minimize-GPUs axis lets a 2×-GPU config
  # displace a tied cheaper one on the front. Compare topologies by reading the
  # tp/dp/replicas triple out of each config.
  #
  # NEITHER OBJECTIVE PROTECTS AGAINST AMPUTATION. Closed-loop follow-up rounds
  # carry a hard-coded 300 s deadline (sim/workload/session.go:322 →
  # generator.go:806, no CLI flag) and a timeout cancels the rest of its session,
  # which both RAISES tokens_per_sec and LOWERS ttft_p99_ms — it looks like a
  # Pareto improvement on both axes. Read timed_out_requests and
  # completed_requests on every result, and consider gating the search with
  # --slo "timed_out_requests<N" once step 0 gives you a sane N.
  - metric: tokens_per_sec
    direction: maximize
  - metric: ttft_p99_ms
    direction: minimize

# Documentation only — the evaluator returns every numeric key in the metrics
# JSON regardless. --slo may reference any of these.
secondary_metrics:
  # Amputation guards. Read these FIRST, before either objective.
  - timed_out_requests
  - completed_requests
  - dropped_unservable
  # The other throughput reading: completed rounds per second.
  - responses_per_sec
  - e2e_p99_ms
  - ttft_mean_ms
  - itl_mean_ms
  - scheduling_delay_p99_ms
  # KV pressure. This is the axis the topology comparison turns on — tp32 has
  # 3.6× the baseline KV, so preemption_count is where the DERIVED scale-up
  # advantage should show up.
  - preemption_count
  - kv_allocation_failures
  # The mechanism behind the routing tradeoff at tp16 × 2: splitting a session
  # across replicas discards its accumulated prefix.
  - cache_hit_rate
  - total_input_tokens
  - total_output_tokens

hypervolume_reference:
  # Normalizers, NOT nadir points — pareto.py DIVIDES by these, and the keys must
  # match `objectives` EXACTLY (search.py:330 silently falls back to 100000.0).
  #
  # >>> UNCALIBRATED — DERIVED placeholders, no blis run was permitted for this
  # >>> file. Replace both from the step-0 probe before reading any hypervolume
  # >>> trajectory or convergence verdict.
  #
